<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بارکد ورود مستقیم | APW</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Vazirmatn, Tahoma, sans-serif;
      background: #14110c;
      color: #f5f0e8;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 8px; }
    .note {
      text-align: center; color: #a89a86; font-size: .9rem;
      max-width: 640px; margin: 0 auto 28px; line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 980px;
      margin: 0 auto;
    }
    .card {
      background: linear-gradient(145deg, #2a2318, #1a1610);
      border: 1px solid #3d3428;
      border-radius: 16px;
      padding: 22px 18px;
      text-align: center;
    }
    .card h2 { font-size: 1.15rem; margin-bottom: 6px; color: #f5a623; }
    .card .role { font-size: .82rem; color: #a89a86; margin-bottom: 14px; }
    .qr-wrap {
      display: flex; justify-content: center; align-items: center;
      background: #fff; border-radius: 12px; padding: 12px; margin: 0 auto;
      width: 220px; height: 220px;
    }
    .qr-wrap canvas { width: 196px !important; height: 196px !important; }
    .card a.link-text {
      display: block; margin-top: 12px; font-size: .72rem;
      color: #f5c56a; word-break: break-all; text-decoration: none; line-height: 1.5;
    }
    .open-btn {
      display: inline-block; margin-top: 12px; padding: 10px 18px;
      background: #f5a623; color: #1a1208; font-weight: 700;
      border-radius: 10px; text-decoration: none; font-size: .95rem;
    }
    .warn {
      max-width: 980px; margin: 28px auto 0;
      background: #2a2214; border: 1px solid #5a4020;
      border-radius: 12px; padding: 16px 18px; font-size: .88rem; line-height: 1.8;
      color: #f5e6c8;
    }
    .warn strong { color: #f5a623; }
    @media print {
      body { background: #fff; color: #111; }
      .warn { border-color: #ccc; color: #333; background: #f7f7f7; }
      .card { break-inside: avoid; border-color: #ddd; background: #fff; }
      .card h2 { color: #b45309; }
      .card a.link-text { color: #333; }
      .open-btn { display: none; }
    }
  </style>
</head>
<body>
  <h1>بارکد ورود مستقیم — APW ایرانیان</h1>
  <p class="note">هر نفر با اسکن بارکد خودش مستقیم وارد حساب خودش می‌شود. این صفحه را چاپ کنید و کنار دستگاه بگذارید.</p>

  <div class="grid" id="grid"></div>

  <div class="warn">
    <strong>نکته:</strong> بارکد را با دوربین گوشی اسکن کنید. اگر اسکن کار نکرد، دکمه «باز کردن لینک» را بزنید.<br>
    این بارکدها را فقط به خود همان نفر بدهید.
  </div>

  <script>
    const BASE = "https://mehdisoltani21-dot.github.io/People-Managment/panel/";
    const people = [
      { name: "مهدی سلطانی", token: "apw-ms-k8v2n4" },
      { name: "مسعود کاظمی", token: "apw-mk-p3w9x1" },
      { name: "مهدی افشار", token: "apw-ma-h5t7q2" },
      { name: "آرش بابا", token: "apw-ab-r6y4m8" }
    ];

    const grid = document.getElementById("grid");

    function makeCard(p) {
      const url = BASE + "?t=" + encodeURIComponent(p.token);
      const card = document.createElement("div");
      card.className = "card";
      const qrId = "qr-" + p.token;
      card.innerHTML =
        "<h2>" + p.name + "</h2>" +
        "<div class=\"role\">ورود مستقیم به حساب</div>" +
        "<div class=\"qr-wrap\" id=\"" + qrId + "\"></div>" +
        "<a class=\"open-btn\" href=\"" + url + "\" target=\"_blank\" rel=\"noopener\">باز کردن لینک</a>" +
        "<a class=\"link-text\" href=\"" + url + "\">" + url + "</a>";
      grid.appendChild(card);

      const box = document.getElementById(qrId);
      if (window.QRCode && QRCode.toCanvas) {
        QRCode.toCanvas(url, {
          width: 196,
          margin: 1,
          color: { dark: "#000000", light: "#ffffff" }
        }, function (err, canvas) {
          if (err) {
            box.innerHTML = "<span style=\"color:#333;font-size:12px\">خطا در ساخت بارکد</span>";
            return;
          }
          box.innerHTML = "";
          box.appendChild(canvas);
        });
      } else {
        box.innerHTML = "<a href=\"" + url + "\" style=\"color:#333\">لینک ورود</a>";
      }
    }

    function start() {
      people.forEach(makeCard);
    }

    if (window.QRCode) {
      start();
    } else {
      window.addEventListener("load", start);
      setTimeout(start, 800);
    }
  </script>
</body>
</html>
