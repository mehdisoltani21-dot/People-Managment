<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5a623">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APW">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.svg">
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml">
  <title>سامانه‌های مدیریت تولید | APW ایرانیان</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body,button,input,select,textarea,a,h1,h2,h3,p,span,label{font-family:Vazirmatn,Tahoma,system-ui,sans-serif!important}
    body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;min-height:100vh;color:#f5f0e8;background:#14110c;
      background-image:linear-gradient(160deg,rgba(15,13,10,.82),rgba(20,16,12,.88)),url('./bg-mdf.jpg');
      background-size:cover;background-position:center;background-attachment:fixed}
    .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 40px}
    .logo-wrap{background:#fff;border-radius:18px;padding:14px 22px;box-shadow:0 12px 40px rgba(0,0,0,.35);margin-bottom:10px}
    .logo-wrap img{display:block;height:52px;width:auto}
    .brand-sub{text-align:center;color:#cbbfaa;font-size:.95rem;margin-bottom:22px;font-weight:600}
    .panel{width:100%;max-width:420px;background:linear-gradient(160deg,rgba(42,35,24,.94),rgba(22,18,12,.96));
      border:1px solid #3d3428;border-radius:22px;padding:22px 18px 18px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
    .panel h1{text-align:center;color:#f5a623;font-size:1.15rem;font-weight:800;margin-bottom:14px}
    .user-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;
      background:rgba(20,17,12,.7);border:1px solid #3d3428;border-radius:14px}
    .user-bar .name{font-weight:700;font-size:.9rem}
    .user-bar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-left:6px}
    .badge{font-size:.75rem;color:#1a1208;background:linear-gradient(135deg,#f5a623,#e8910f);padding:4px 10px;border-radius:999px;font-weight:700}
    .logout{font-family:inherit;font-size:.8rem;font-weight:700;color:#f5a623;background:transparent;border:1px solid rgba(245,166,35,.45);border-radius:9px;padding:.4rem .8rem;cursor:pointer}
    .menu a{display:flex;align-items:center;gap:12px;padding:14px 14px;margin-bottom:10px;border-radius:16px;text-decoration:none;color:#f5f0e8;
      background:linear-gradient(145deg,#2a2318,#1c1710);border:1px solid #3d3428;transition:.15s}
    .menu a:hover{border-color:#f5a623;transform:translateY(-1px)}
    .menu .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#f5a623,#e8910f);color:#1a1208;font-size:1.2rem;font-weight:800;flex-shrink:0}
    .menu .txt{flex:1;min-width:0}
    .menu .ttl{font-weight:800;font-size:1rem;display:block}
    .menu .sub{font-size:.78rem;color:#a89a86;display:block;margin-top:2px}
    .menu .arr{color:#f5a623;font-weight:800;font-size:1.1rem}
    .login-box{width:100%;max-width:400px;background:linear-gradient(160deg,rgba(42,35,24,.95),rgba(22,18,12,.97));
      border:1px solid #3d3428;border-radius:22px;padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
    .login-box h2{text-align:center;color:#f5a623;font-size:1.15rem;font-weight:800;margin-bottom:6px}
    .login-box .sub{text-align:center;color:#a89a86;font-size:.88rem;margin-bottom:16px}
    .login-form label{display:block;font-size:.85rem;color:#a89a86;margin-bottom:4px}
    .login-form select,.login-form input{width:100%;font-family:inherit;font-size:1rem;color:#f5f0e8;background:#16120e;border:1px solid #4a4030;border-radius:12px;padding:.8rem .9rem;outline:none;margin-bottom:12px}
    .login-btn{margin-top:6px;width:100%;font-family:inherit;font-size:1rem;font-weight:800;color:#1a1208;cursor:pointer;background:linear-gradient(135deg,#f7b543,#e8910f);border:none;border-radius:12px;padding:.85rem}
    .login-error{color:#f87171;font-size:.85rem;min-height:1.2em;margin-top:8px;text-align:center}
    [hidden]{display:none!important}
  </style>
  <script>
  // مسیر پایه: Cloudflare = /  |  GitHub Pages = /People-Managment/
  window.APW_BASE = (location.pathname.indexOf("/People-Managment") === 0)
    ? (location.origin + "/People-Managment/")
    : (location.origin + "/");
  // اگر آدرس تو در تو اشتباه بود، برو ریشه
  if (/\/5s\/5s|\/panel\/panel|\/process\/process/.test(location.pathname)) {
    location.replace(window.APW_BASE);
  }
  </script>
</head>
<body>
  <div class="wrap">
    <div class="logo-wrap"><img src="./logo.png?v=2" alt="APW" onerror="this.style.display='none'"></div>
    <p class="brand-sub">APW ایرانیان · واحد تولید</p>

    <section id="login-section" class="login-box" hidden>
      <h2>ورود به سامانه</h2>
      <p class="sub">نام کاربری و رمز عبور</p>
      <form id="login-form" class="login-form">
        <label for="loginUser">کاربر</label>
        <select id="loginUser" required>
          <option value="">— انتخاب —</option>
          <option value="mahdi-soltani">مهدی سلطانی</option>
          <option value="masoud-kazemi">مسعود کاظمی</option>
          <option value="mahdi-afshar">مهدی افشار</option>
          <option value="arash-baba">آرش بابا</option>
        </select>
        <label for="loginPass">رمز عبور</label>
        <input type="password" id="loginPass" required autocomplete="current-password">
        <button type="submit" class="login-btn">ورود</button>
        <p id="login-error" class="login-error"></p>
      </form>
    </section>

    <section id="app-section" class="panel" hidden>
      <h1>سامانه‌های مدیریت تولید</h1>
      <div class="user-bar">
        <div>
          <span class="dot"></span>
          <span class="name" id="current-user-label">کاربر</span>
        </div>
        <span class="badge" id="access-badge">دسترسی</span>
        <button type="button" class="logout" id="logout-btn">خروج</button>
      </div>
      <nav class="menu">
        <a data-path="panel/" href="./panel/">
          <span class="ic">👤</span>
          <span class="txt"><span class="ttl">مدیریت وقایع پرسنلی</span><span class="sub">ثبت خطا، اخطار و سوابق نفرات</span></span>
          <span class="arr">‹</span>
        </a>
        <a data-path="process/" href="./process/">
          <span class="ic">◎</span>
          <span class="txt"><span class="ttl">مدیریت وقایع فرآیندی</span><span class="sub">تعمیرات، برش، کاپاک، کارتن و نظافت خط</span></span>
          <span class="arr">‹</span>
        </a>
        <a data-path="5s/" href="./5s/">
          <span class="ic">☑</span>
          <span class="txt"><span class="ttl">مدیریت نظام آراستگی</span><span class="sub">ارزیابی 5S + گزارش تحلیلی نفرات</span></span>
          <span class="arr">‹</span>
        </a>
      </nav>
    </section>
  </div>

  <script>
  (function(){
    var B = window.APW_BASE || (location.origin + "/");
    document.querySelectorAll("a[data-path]").forEach(function(a){
      a.setAttribute("href", B + a.getAttribute("data-path"));
    });
  })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    const SUPABASE_URL = "https://rtefjfvkjpatzitjjvwe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RK_M3waIU7Z4jLYcs5LFqQ_7dSYHDFP";
    if (!window.supabase) return;
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.supabaseClient = supabaseClient;

    const loginSection = document.getElementById("login-section");
    const appSection = document.getElementById("app-section");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const userLabel = document.getElementById("current-user-label");
    const accessBadge = document.getElementById("access-badge");
    const logoutBtn = document.getElementById("logout-btn");

    function showLogin() {
      if (loginSection) loginSection.hidden = false;
      if (appSection) appSection.hidden = true;
    }
    function showApp(profile, user) {
      if (loginSection) loginSection.hidden = true;
      if (appSection) appSection.hidden = false;
      const name = (profile && (profile.full_name || profile.username)) || (user && user.email) || "کاربر";
      if (userLabel) userLabel.textContent = name;
      if (accessBadge) accessBadge.textContent = (profile && profile.role === "admin") ? "دسترسی کامل" : "دسترسی کاربر";
    }

    async function loadProfile(user) {
      const { data } = await supabaseClient.from("user_profiles").select("*").eq("id", user.id).maybeSingle();
      return data;
    }

    if (loginForm) {
      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        loginError.textContent = "";
        const u = document.getElementById("loginUser").value;
        const p = document.getElementById("loginPass").value;
        try {
          const emails = [u + "@people-manager.invalid"];
          if (u.indexOf("mehdi-")===0) emails.push(u.replace("mehdi-","mahdi-") + "@people-manager.invalid");
          if (u.indexOf("mahdi-")===0) emails.push(u.replace("mahdi-","mehdi-") + "@people-manager.invalid");
          let data=null, error=null;
          for (let i=0;i<emails.length;i++){
            const res = await supabaseClient.auth.signInWithPassword({ email: emails[i], password: p });
            if (!res.error && res.data && res.data.user){ data=res.data; error=null; break; }
            error = res.error;
          }
          if (error) throw error;
          const profile = await loadProfile(data.user);
          showApp(profile, data.user);
        } catch (err) {
          loginError.textContent = "ورود ناموفق: " + (err.message || "خطا");
        }
      });
    }

    if (logoutBtn) {
      logoutBtn.addEventListener("click", async function () {
        await supabaseClient.auth.signOut();
        showLogin();
      });
    }

    supabaseClient.auth.getSession().then(async function (r) {
      const s = r.data && r.data.session;
      if (s && s.user) {
        const profile = await loadProfile(s.user);
        showApp(profile, s.user);
      } else {
        showLogin();
      }
    }).catch(showLogin);
  })();
  </script>
  <script src="./access.js?v=4"></script>
</body>
</html>
