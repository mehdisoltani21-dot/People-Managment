<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1510">
  <title>APW ایرانیان | تولید ام‌دی‌اف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Vazirmatn", system-ui, sans-serif;
      min-height: 100vh;
      color: #fff;
      background: #1a1510;
    }
    .bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(160deg, #2a1f14 0%, #1a1510 40%, #0f0c08 100%);
      z-index: 0;
    }
    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(245,166,35,0.18), transparent 55%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(180,120,40,0.12), transparent 50%);
    }
    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .logo-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 1.2rem 2rem;
      margin-bottom: 1.6rem;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }
    .logo-box img {
      display: block;
      height: 60px;
      width: auto;
    }
    h1 {
      font-size: clamp(1.9rem, 5.5vw, 2.8rem);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }
    h1 span { color: #f5a623; }
    .subtitle {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: rgba(255,255,255,0.85);
      font-weight: 400;
      max-width: 400px;
      margin: 0 auto 2.1rem;
      line-height: 1.7;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f5a623;
      color: #1a1208;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      padding: 1rem 2.8rem;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(245, 166, 35, 0.42);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(245, 166, 35, 0.55);
    }
    .hint {
      margin-top: 0.85rem;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.55);
    }
    footer {
      position: absolute;
      bottom: 1.2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
    }
    @media (max-width: 480px) {
      .logo-box img { height: 48px; }
      .btn {
        width: 100%;
        max-width: 280px;
        padding: 0.95rem 1.5rem;
      }
    }
  </style>
</head>
