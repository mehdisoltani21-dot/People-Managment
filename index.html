<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5a623">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APW">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.svg">
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml">
  <title>APW ایرانیان | تولید ام‌دی‌اف</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Vazirmatn,system-ui,sans-serif;min-height:100vh;color:#fff;background:#1a1510}
    .bg{position:fixed;inset:0;background:linear-gradient(160deg,#2a1f14 0%,#1a1510 45%,#0f0c08 100%);z-index:0}
    .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(245,166,35,.2),transparent 55%)}
    .wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.25rem;text-align:center}
    .logo-box{background:#fff;border-radius:16px;padding:1.1rem 1.8rem;margin-bottom:1.5rem;box-shadow:0 16px 40px rgba(0,0,0,.45)}
    .logo-text{font-family:Arial Black,Arial,sans-serif;font-size:2.6rem;font-weight:900;letter-spacing:-.04em;line-height:1}
    .logo-text .a{color:#f5a623}
    .logo-text .pw{color:#3d3d3d}
    h1{font-size:clamp(1.9rem,5.5vw,2.8rem);font-weight:800;margin-bottom:.5rem}
    h1 span{color:#f5a623}
    .subtitle{font-size:1.05rem;color:rgba(255,255,255,.85);max-width:400px;margin:0 auto 1.75rem;line-height:1.7}
    .btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
    .btn{
      display:flex;align-items:center;justify-content:center;
      background:#f5a623;color:#1a1208;font-family:inherit;
      font-size:1.05rem;font-weight:700;text-decoration:none;
      padding:1rem 1.5rem;border-radius:12px;
      box-shadow:0 10px 28px rgba(245,166,35,.42);
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(245,166,35,.55)}
    .btn-secondary{
      background:transparent;color:#f5a623;
      border:2px solid rgba(245,166,35,.65);
      box-shadow:none;
    }
    .btn-secondary:hover{background:rgba(245,166,35,.12);box-shadow:0 8px 24px rgba(245,166,35,.2)}
    .hint{margin-top:1rem;font-size:.82rem;color:rgba(255,255,255,.55)}
    .install-btn{margin-top:1rem;background:transparent;border:1px solid rgba(245,166,35,.5);color:#f5a623;font-family:inherit;font-size:.95rem;font-weight:600;padding:.7rem 1.5rem;border-radius:10px;cursor:pointer;display:none}
    .install-btn.show{display:inline-flex}
    footer{position:absolute;bottom:1.2rem;left:0;right:0;text-align:center;font-size:.78rem;color:rgba(255,255,255,.4)}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="logo-box">
      <div class="logo-text"><span class="a">A</span><span class="pw">PW</span></div>
    </div>
    <h1><span>APW</span> ایرانیان</h1>
    <p class="subtitle">تولیدکننده تخصصی ام‌دی‌اف و محصولات چوبی</p>
    <div class="btns">
      <a class="btn" href="./panel/">ورود به مدیریت نفرات</a>
      <a class="btn btn-secondary" href="./5s/">ورود به مدیریت 5S</a>
    </div>
    <button type="button" id="install-btn" class="install-btn">نصب روی گوشی</button>
    <p class="hint">سامانه‌های واحد تولید APW</p>
    <footer>APW ایرانیان · تولید ام‌دی‌اف</footer>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }
    var deferredPrompt = null;
    var installBtn = document.getElementById("install-btn");
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add("show");
    });
    installBtn.addEventListener("click", function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () {
        deferredPrompt = null;
        installBtn.classList.remove("show");
      });
    });
    window.addEventListener("appinstalled", function () {
      installBtn.classList.remove("show");
    });
  </script>
</body>
</html>
