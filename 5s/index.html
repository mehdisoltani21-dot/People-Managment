<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5a623">
  <title>مدیریت 5S | APW</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Vazirmatn,Tahoma,sans-serif;
      min-height:100vh;background:#14110c;color:#f5f0e8;
      display:flex;align-items:center;justify-content:center;
      padding:24px 16px;text-align:center;
    }
    .card{
      width:100%;max-width:420px;
      background:linear-gradient(145deg,#2a2318,#1a1610);
      border:1px solid #3d3428;border-radius:18px;padding:32px 24px;
    }
    .logo{
      display:inline-block;background:#fff;border-radius:12px;
      padding:10px 18px;margin-bottom:18px;
      font-family:Arial Black,Arial,sans-serif;font-size:1.8rem;font-weight:900;
    }
    .logo .a{color:#f5a623}
    .logo .pw{color:#3d3d3d}
    h1{font-size:1.35rem;margin-bottom:8px}
    p{color:#a89a86;font-size:.95rem;line-height:1.8;margin-bottom:22px}
    a{
      display:inline-block;background:#f5a623;color:#1a1208;
      font-weight:700;text-decoration:none;padding:12px 22px;border-radius:12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="a">A</span><span class="pw">PW</span></div>
    <h1>مدیریت 5S</h1>
    <p>این بخش به‌زودی آماده می‌شود.<br>در صورت نیاز جزئیات و فرم‌های 5S را بفرستید تا کامل پیاده‌سازی شود.</p>
    <a href="../">بازگشت به صفحه اصلی</a>
  </div>
</body>
</html>
