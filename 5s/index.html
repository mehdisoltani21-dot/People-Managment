<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script src="../gate.js?v=3"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5a623">
<title>مدیریت 5S | APW</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;background:#14110c;color:#f5f0e8;min-height:100vh;line-height:1.7}
.container{max-width:980px;margin:0 auto;padding:16px}
.header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:14px;border:1px solid #3d3428;border-radius:16px;background:linear-gradient(145deg,#2a2318,#1a1610);margin-bottom:16px}
.btn{border:none;border-radius:12px;padding:.65rem 1.1rem;font-weight:800;cursor:pointer;font:inherit}
.btn-primary{background:linear-gradient(135deg,#f7b543,#e8910f);color:#1a1208}
.btn-secondary{background:#2a2418;color:#f5c56a;border:1px solid #4a4030}
.nav-home,.view-back{background:linear-gradient(135deg,#f5a623,#e8910f)!important;color:#1a1208!important;font-weight:800!important;border:none;border-radius:10px;padding:.45rem .9rem;text-decoration:none;display:inline-block;cursor:pointer;margin:6px 0}
.card{border:1px solid #3d3428;border-radius:14px;background:#1a1610;padding:14px;margin-bottom:12px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.home-grid{grid-template-columns:1fr}}
.home-card{min-height:150px;border:1px solid #3d3428;border-radius:16px;background:linear-gradient(145deg,#2a2318,#1a1610);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:inherit}
.home-card:hover{border-color:#f5a623}
.fg{margin-bottom:10px}.fg label{display:block;font-size:.82rem;color:#a89a86;margin-bottom:4px}
.fg input,.fg select,textarea{width:100%;padding:9px 10px;border-radius:10px;border:1px solid #4a4030;background:#14110c;color:#f5f0e8;font:inherit}
.section-title{color:#f5a623;font-weight:800;margin:14px 0 8px;padding:8px;background:#241e16;border-radius:10px}
.report-card{cursor:pointer;transition:border-color .15s}.report-card:hover{border-color:#f5a623}
.msg{color:#a89a86;margin-top:8px}[hidden]{display:none!important}
.detail-box{background:#14110c;border:1px solid #3d3428;border-radius:12px;padding:12px;margin-top:10px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <strong style="font-size:1.1rem">مدیریت نظام آراستگی (5S)</strong>
      <div style="font-size:.8rem;color:#a89a86">APW ایرانیان · واحد تولید</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="current-user-label">...</span>
      <a class="nav-home" href="../">صفحه اصلی</a>
      <a class="nav-home" href="./analytics.html">گزارش تحلیلی</a>
      <button type="button" class="btn btn-secondary" id="logout-btn">خروج</button>
    </div>
  </div>

  <section id="login-page" hidden>
    <div class="card" style="max-width:400px;margin:40px auto">
      <h2>ورود 5S</h2>
      <form id="login-form">
        <div class="fg"><label>کاربر</label>
          <select id="loginUser" required>
            <option value="">—</option>
            <option value="mehdi-soltani">مهدی سلطانی</option>
            <option value="masoud-kazemi">مسعود کاظمی</option>
            <option value="mehdi-afshar">مهدی افشار</option>
            <option value="arash-baba">آرش بابا</option>
          </select>
        </div>
        <div class="fg"><label>رمز</label><input type="password" id="loginPass" required></div>
        <button class="btn btn-primary" type="submit">ورود</button>
        <p id="login-error" class="msg"></p>
      </form>
    </div>
  </section>

  <section id="app-page" hidden>
    <section id="home-view">
      <div class="home-grid">
        <button type="button" class="home-card" id="btn-new"><div style="font-size:1.8rem;font-weight:900">+</div><strong>رکورد جدید</strong><span style="color:#a89a86;font-size:.85rem">ارزیابی 5S</span></button>
        <button type="button" class="home-card" id="btn-list"><div style="font-size:1.8rem;font-weight:900">≡</div><strong>مشاهده رکوردها</strong><span style="color:#a89a86;font-size:.85rem">گزارش‌های ثبت‌شده</span></button>
      </div>
    </section>

    <section id="form-view" hidden>
      <button type="button" class="view-back" id="back-form">→ بازگشت</button>
      <div class="card">
        <h2 style="color:#f5a623;margin-bottom:12px">ثبت ارزیابی 5S</h2>
        <div class="fg"><label>تاریخ</label><input type="date" id="audit-date"></div>
        <div class="fg"><label>ایستگاه کاری</label><input type="text" id="workstation" list="ws-list"><datalist id="ws-list"></datalist></div>
        <div class="fg"><label>ارزیاب</label>
          <select id="auditor">
            <option>Mahdi Soltani</option><option>Masoud Kazemi</option><option>Arash Baba</option><option>Mahdi Afshar</option>
          </select>
        </div>
        <div class="fg"><label>اپراتور</label><select id="operator"></select></div>
        <div class="fg"><label>کمک ۱</label><select id="assistant1"></select></div>
        <div class="fg"><label>کمک ۲</label><select id="assistant2"></select></div>
        <div class="fg"><label>کمک ۳</label><select id="assistant3"></select></div>
        <div id="sections"></div>
        <p class="msg">جمع امتیاز: <strong id="total-score" style="color:#f5a623">0</strong></p>
        <button type="button" class="btn btn-primary" id="btn-save">ذخیره آنلاین</button>
        <p id="save-msg" class="msg"></p>
      </div>
    </section>

    <section id="list-view" hidden>
      <button type="button" class="view-back" id="back-list">→ بازگشت</button>
      <div class="card">
        <h2 style="color:#f5a623;margin-bottom:12px">گزارش‌های 5S</h2>
        <p class="msg" style="margin-bottom:12px">روی هر کارت کلیک کنید تا جزئیات کامل باز شود</p>
        <div id="reports"></div>
        <div id="detail" class="detail-box" hidden></div>
      </div>
    </section>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rtefjfvkjpatzitjjvwe.supabase.co";
const SUPABASE_KEY="sb_publishable_RK_M3waIU7Z4jLYcs5LFqQ_7dSYHDFP";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
window.supabaseClient=supabaseClient;
let currentUser=null,currentProfile=null;
window.auditsCache=[];

const PEOPLE=[{id:"7020",name:"Arash Baba"},{id:"7021",name:"Daryoush Kazemkhanloo"},{id:"7022",name:"Mehdi Afashar Vangini"},{id:"7023",name:"Hossein Amandiha"},{id:"7065",name:"Alireza Zolghadr"},{id:"7071",name:"Rahim Ghalandari"},{id:"7083",name:"Mohammad Khalkhali"},{id:"7085",name:"Hossein Taghiloo"},{id:"7088",name:"Mohsen Mirasheh"},{id:"7089",name:"Mohammad Qazvini"},{id:"7092",name:"Saeid Rezaei"},{id:"7111",name:"Mohammadreza Esmaili"},{id:"7118",name:"Alireza Soleymani"},{id:"7152",name:"Amin Rastegar"},{id:"7154",name:"Keykhosro Gurani"},{id:"7196",name:"Hossein Dehghan Nejad"},{id:"7197",name:"Esmaeil Alian"},{id:"7216",name:"Farzin Shali"},{id:"7240",name:"Dariush Hazrati"}];
const WS=["ورودی","روکش زیرین","سنباده پنل","روکش فوقانی","اوستا باشی پنل","اوستاباشی پروفیل","گزارشگیر","بسته بندی پنل","برش فویل","روکش پروفیل","سنباده پروفیل","فرزه","سلکو","پالت سازی"];
const SECTIONS=[
  {name:"جداسازی (Seiri)",items:["اقلام غیرضروری از محل کار جمع‌آوری شده","مسیرها و کف آزاد از مانع است","مواد معیوب/اسقاط مشخص و جدا شده"]},
  {name:"نظم و ترتیب (Seiton)",items:["هر وسیله جای مشخص دارد","برچسب‌گذاری قفسه‌ها و ابزار انجام شده","ابزار پرمصرف در دسترس اپراتور است"]},
  {name:"پاکیزگی (Seiso)",items:["کف و میز کار تمیز است","ماشین‌آلات عاری از گردوغبار و براده‌اند","برنامه نظافت روزانه اجرا می‌شود"]},
  {name:"استانداردسازی (Seiketsu)",items:["استاندارد چیدمان مستند و نصب شده","چک‌لیست روزانه در محل موجود است","مسئول هر ناحیه مشخص است"]},
  {name:"انضباط (Shitsuke)",items:["اپراتورها آموزش 5S دیده‌اند","رعایت قوانین ایمنی مشهود است","بهبود مستمر ثبت و پیگیری می‌شود"]}
];

function $(id){return document.getElementById(id)}
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function fillSelect(sel,items,ph){sel.innerHTML="";const o=document.createElement("option");o.value="";o.textContent=ph||"—";sel.appendChild(o);items.forEach(p=>{const x=document.createElement("option");x.value=p.id||p;x.textContent=p.name||p;sel.appendChild(x)})}

function buildSections(){
  const box=$("sections");box.innerHTML="";
  SECTIONS.forEach((sec,si)=>{
    const h=document.createElement("div");h.className="section-title";h.textContent=sec.name;box.appendChild(h);
    sec.items.forEach((it,ii)=>{
      const row=document.createElement("div");row.className="card";row.style.padding="10px";
      row.innerHTML='<div style="margin-bottom:6px">'+it+'</div>'+
        '<div class="fg"><label>امتیاز (0 تا 5)</label><input type="number" min="0" max="5" class="score" data-s="'+si+'" data-i="'+ii+'" value="0"></div>'+
        '<div class="fg"><label>توضیح</label><input type="text" class="note" data-s="'+si+'" data-i="'+ii+'"></div>';
      box.appendChild(row);
    });
  });
  box.querySelectorAll(".score").forEach(inp=>inp.oninput=recalc);
}
function recalc(){let t=0;document.querySelectorAll(".score").forEach(i=>t+=Number(i.value)||0);$("total-score").textContent=String(t)}
function collect(){
  const sections=SECTIONS.map((sec,si)=>({name:sec.name,items:sec.items.map((label,ii)=>{
    const score=document.querySelector('.score[data-s="'+si+'"][data-i="'+ii+'"]');
    const note=document.querySelector('.note[data-s="'+si+'"][data-i="'+ii+'"]');
    return {label,score:Number(score&&score.value||0),note:(note&&note.value)||""};
  })}));
  let total=0;sections.forEach(s=>s.items.forEach(i=>total+=i.score));
  return {date:$("audit-date").value,workstation:$("workstation").value,auditor:$("auditor").value,
    operatorId:$("operator").value,operator:($("operator").selectedOptions[0]&&$("operator").selectedOptions[0].textContent)||"",
    sections,total,max:SECTIONS.reduce((a,s)=>a+s.items.length*5,0)};
}

function showLogin(){$("login-page").hidden=false;$("app-page").hidden=true}
function showApp(){$("login-page").hidden=true;$("app-page").hidden=false;showHome()}
function showHome(){$("home-view").hidden=false;$("form-view").hidden=true;$("list-view").hidden=true}
function showForm(){$("home-view").hidden=true;$("form-view").hidden=false;$("list-view").hidden=true;$("audit-date").value=today();recalc()}

function renderDetail(r){
  const d=$("detail");d.hidden=false;
  let html='<h3 style="color:#f5a623">گزارش #'+(r.report_no||"-")+'</h3>';
  html+='<p>تاریخ: '+(r.audit_date||"-")+' | ایستگاه: '+(r.area||"-")+' | ارزیاب: '+(r.auditor||"-")+'</p>';
  html+='<p>اپراتور: '+(r.operator_name||"-")+' | کمک‌ها: '+[r.assistant1_name,r.assistant2_name,r.assistant3_name].filter(Boolean).join('، ')+'</p>';
  html+='<p><strong>امتیاز: '+(r.total_score||0)+' / '+(r.max_score||0)+'</strong></p>';
  const secs=(r.details&&r.details.sections)||[];
  secs.forEach(sec=>{
    html+='<div class="section-title">'+sec.name+'</div>';
    (sec.items||[]).forEach(it=>{
      html+='<div style="padding:6px 0;border-bottom:1px solid #2a2418">'+it.label+' — امتیاز: <b>'+it.score+'</b>'+(it.note?' — '+it.note:'')+'</div>';
    });
  });
  d.innerHTML=html;
  d.scrollIntoView({behavior:"smooth"});
}

async function showList(){
  $("home-view").hidden=true;$("form-view").hidden=true;$("list-view").hidden=false;$("detail").hidden=true;
  const {data,error}=await supabaseClient.from("five_s_audits").select("*").order("report_no",{ascending:false}).limit(100);
  const box=$("reports");box.innerHTML="";
  if(error){box.innerHTML='<p class="msg">'+error.message+'</p>';return}
  window.auditsCache=data||[];
  if(!data||!data.length){box.innerHTML='<p class="msg">رکوردی نیست</p>';return}
  data.forEach((r,idx)=>{
    const el=document.createElement("div");
    el.className="card report-card";
    el.innerHTML='<strong style="color:#f5a623">گزارش #'+(r.report_no||"-")+'</strong>'+
      '<div style="color:#a89a86;font-size:.9rem;margin-top:4px">'+(r.audit_date||"")+' · '+(r.area||"-")+'</div>'+
      '<div style="margin-top:6px">امتیاز: <b>'+(r.total_score||0)+'</b>/'+(r.max_score||0)+' · '+(r.operator_name||"-")+'</div>'+
      '<div style="font-size:.8rem;color:#8a7a68;margin-top:4px">برای مشاهده جزئیات کلیک کنید</div>';
    el.onclick=function(){renderDetail(r)};
    box.appendChild(el);
  });
}

$("btn-new").onclick=showForm;$("btn-list").onclick=showList;
$("back-form").onclick=showHome;$("back-list").onclick=showHome;

$("btn-save").onclick=async function(){
  if(!currentUser){alert("وارد شوید");return}
  try{
    const data=collect();$("save-msg").textContent="در حال ذخیره...";
    const {data:maxRows}=await supabaseClient.from("five_s_audits").select("report_no").order("report_no",{ascending:false}).limit(1);
    const nextNo=((maxRows&&maxRows[0]&&maxRows[0].report_no)||0)+1;
    const asst=[$("assistant1"),$("assistant2"),$("assistant3")];
    const row={report_no:nextNo,audit_date:data.date||null,area:data.workstation||null,auditor:data.auditor||null,
      operator_id:data.operatorId||null,operator_name:data.operator||null,
      assistant1_id:asst[0].value||null,assistant1_name:(asst[0].selectedOptions[0]&&asst[0].selectedOptions[0].text)||null,
      assistant2_id:asst[1].value||null,assistant2_name:(asst[1].selectedOptions[0]&&asst[1].selectedOptions[0].text)||null,
      assistant3_id:asst[2].value||null,assistant3_name:(asst[2].selectedOptions[0]&&asst[2].selectedOptions[0].text)||null,
      total_score:data.total||0,max_score:data.max||0,details:{sections:data.sections},
      created_by:currentUser.id,created_by_name:(currentProfile&&(currentProfile.full_name||currentProfile.username))||""};
    const {error}=await supabaseClient.from("five_s_audits").insert(row);
    if(error)throw error;
    $("save-msg").textContent="ذخیره شد — شماره "+nextNo;
    setTimeout(showHome,800);
  }catch(err){$("save-msg").textContent="";alert(err.message||err)}
};

$("logout-btn").onclick=async function(){await supabaseClient.auth.signOut();location.replace("../")};
$("login-form").onsubmit=async function(e){
  e.preventDefault();
  try{
    const u=$("loginUser").value,p=$("loginPass").value;
    const {data,error}=await supabaseClient.auth.signInWithPassword({email:u+"@people-manager.invalid",password:p});
    if(error)throw error;
    currentUser=data.user;
    const {data:prof}=await supabaseClient.from("user_profiles").select("*").eq("id",currentUser.id).maybeSingle();
    currentProfile=prof;$("current-user-label").textContent=(prof&&(prof.full_name||prof.username))||u;
    showApp();
  }catch(err){$("login-error").textContent=err.message||"خطا"}
};

(async function(){
  fillSelect($("operator"),PEOPLE,"اپراتور");
  ["assistant1","assistant2","assistant3"].forEach(id=>fillSelect($(id),PEOPLE,"—"));
  const dl=$("ws-list");WS.forEach(w=>{const o=document.createElement("option");o.value=w;dl.appendChild(o)});
  buildSections();
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session&&session.user){
    currentUser=session.user;
    const {data:prof}=await supabaseClient.from("user_profiles").select("*").eq("id",currentUser.id).maybeSingle();
    currentProfile=prof;$("current-user-label").textContent=(prof&&(prof.full_name||prof.username))||"کاربر";
    showApp();
  } else showLogin();
})();
</script>
</body>
</html>
