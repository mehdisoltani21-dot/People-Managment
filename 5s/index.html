<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script src="../gate.js?v=3"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5a623">
<title>مدیریت 5S | APW</title>
</head>
<body style="margin:0;font-family:Tahoma,Vazirmatn,sans-serif;background:#14110c;color:#f5f0e8;display:flex;align-items:center;justify-content:center;min-height:100vh">
<p id="boot">در حال بارگذاری سامانه 5S...</p>
<script>
(async function () {
  try {
    var sources = [
      "./full.html?v=7",
      "https://cdn.jsdelivr.net/gh/mehdisoltani21-dot/People-Managment@81561232a3838886ce9be1846dad0b2660c8aef2/5s/index.html",
      "https://raw.githubusercontent.com/mehdisoltani21-dot/People-Managment/81561232a3838886ce9be1846dad0b2660c8aef2/5s/index.html"
    ];
    var html = null, lastErr = null;
    for (var i = 0; i < sources.length; i++) {
      try {
        var res = await fetch(sources[i]);
        if (!res.ok) throw new Error("HTTP " + res.status);
        html = await res.text();
        break;
      } catch (e) { lastErr = e; }
    }
    if (!html) throw lastErr || new Error("load failed");

    // global cache for report detail
    html = html.replace(
      "let currentUser=null,currentProfile=null,auditsCache=[];",
      "let currentUser=null,currentProfile=null;window.auditsCache=[];"
    );
    html = html.replace(
      "auditsCache=(data||[]).map(mapRow);return auditsCache",
      "window.auditsCache=(data||[]).map(mapRow);return window.auditsCache"
    );
    html = html.split("const r=auditsCache[idx]").join("const r=window.auditsCache[idx]");
    html = html.split("auditsCache[").join("window.auditsCache[");

    // logout → home
    html = html.replace(
      /document\.getElementById\("logout-btn"\)\.onclick=async function\(\)\{await supabaseClient\.auth\.signOut\(\);currentUser=null;showLogin\(\)\};/,
      'document.getElementById("logout-btn").onclick=async function(){await supabaseClient.auth.signOut();location.replace("../")};'
    );

    // gate + report-view (photos + form-like single report)
    if (html.indexOf("gate.js") === -1) {
      html = html.replace("<head>", '<head><script src="../gate.js?v=3"><\/script>');
    }
    if (html.indexOf("report-view.js") === -1) {
      html = html.replace("</body>", '<script src="report-view.js?v=7"><\/script></body>');
    }

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    console.error(e);
    var el = document.getElementById("boot");
    if (el) el.textContent = "خطا در بارگذاری 5S: " + (e && e.message ? e.message : e);
  }
})();
</script>
</body>
</html>
