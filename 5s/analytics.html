<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script src="../gate.js?v=3"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5a623">
<title>گزارش تحلیلی 5S | APW</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#0f0d0a;color:#f5f0e8;min-height:100vh;line-height:1.7}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-box{width:100%;max-width:400px;background:linear-gradient(145deg,#2a2318,#1a1610);border:1px solid #3d3428;border-radius:18px;padding:28px 22px}
.login-box h1{font-size:1.2rem;margin:12px 0 6px;text-align:center}
.login-field{margin-bottom:12px}
.login-field label{display:block;font-size:.85rem;color:#a89a86;margin-bottom:4px}
.login-field select,.login-field input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #4a4030;background:#1a1610;color:#f5f0e8;font-family:inherit}
.btn{border:none;border-radius:12px;padding:11px 18px;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#f5a623,#e8910f);color:#1a1208}
.nav-home{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f5a623,#e8910f);color:#1a1208!important;font-weight:800;font-size:.88rem;padding:10px 16px;border-radius:12px;text-decoration:none}
.top{position:sticky;top:0;z-index:10;background:rgba(15,13,10,.94);border-bottom:1px solid #3d3428;padding:12px 16px}
.top-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.card{background:linear-gradient(145deg,#2a2318,#1a1610);border:1px solid #3d3428;border-radius:16px;padding:16px;margin-bottom:16px}
.filters-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters-row .f{display:flex;flex-direction:column;gap:4px}
.filters-row .f label{font-size:.75rem;color:#a89a86}
.filters-row input,.filters-row select{padding:10px 12px;border-radius:12px;border:1px solid #4a4030;background:#14110c;color:#f5f0e8;font-family:inherit;font-size:.88rem;min-width:140px}
.btn-clear{background:#2a2418;border:1px solid #5a4030;color:#f5c56a;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:700;cursor:pointer}
.btn-excel{background:transparent;border:1px solid #f5a623;color:#f5a623;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:700;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#14110c;border:1px solid #3d3428;border-radius:12px;padding:12px;text-align:center}
.kpi .n{font-size:1.3rem;font-weight:800;color:#f5a623}.kpi .l{font-size:.75rem;color:#a89a86}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:9px 7px;border-bottom:1px solid #2a2418;text-align:right}
th{color:#f5a623;background:#1a1610}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.badge-sub{background:#3b2f1a;color:#fcd34d}
.badge-sol{background:#1a3a2a;color:#86efac}
.badge-fin{background:#1a2a3a;color:#93c5fd}
.btn-act{border:none;border-radius:8px;padding:6px 10px;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;margin:2px}
.btn-view{background:#2a2418;border:1px solid #5a4030;color:#f5c56a}
.btn-rev{background:linear-gradient(135deg,#f5a623,#e8910f);color:#1a1208}
.btn-fin{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:12px}
.modal[hidden]{display:none!important}
.modal-box{width:100%;max-width:900px;max-height:92vh;overflow:auto;background:linear-gradient(160deg,#1e1a14,#16120e);border:1px solid #3d3428;border-radius:18px;padding:18px}
.modal-box h3{color:#f5a623;margin-bottom:10px}
.sec-title{color:#f5a623;font-weight:800;margin:14px 0 8px;padding:8px;background:#241e16;border-radius:10px}
.item-box{border:1px solid #3d3428;border-radius:12px;padding:10px;margin-bottom:8px;background:#14110c}
.item-box .q{margin-bottom:6px}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.item-grid{grid-template-columns:1fr}}
.item-box label{display:block;font-size:.75rem;color:#a89a86;margin-bottom:3px}
.item-box input[type=number],.item-box input[type=text],.item-box textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #4a4030;background:#0f0d0a;color:#f5f0e8;font-family:inherit}
.orig{font-size:.8rem;color:#a89a86;margin-bottom:6px}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #4a4030;margin-top:6px}
.hint{background:#241e16;border:1px solid #3d3428;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.88rem;color:#e8dfd0}
[hidden]{display:none!important}
</style>
</head>
<body>
<section id="login-page" class="login-page" style="display:none">
  <div class="login-box">
    <h1>گزارش تحلیلی 5S</h1>
    <form id="login-form">
      <div class="login-field"><label>کاربر</label>
        <select id="loginUser" required>
          <option value="">—</option>
          <option value="mehdi-soltani">مهدی سلطانی</option>
          <option value="masoud-kazemi">مسعود کاظمی</option>
          <option value="mehdi-afshar">مهدی افشار</option>
          <option value="arash-baba">آرش بابا</option>
        </select>
      </div>
      <div class="login-field"><label>رمز</label><input id="loginPass" type="password" required></div>
      <button class="btn btn-primary" type="submit">ورود</button>
      <p id="login-error" style="color:#f87171;margin-top:8px"></p>
    </form>
    <p style="margin-top:12px;text-align:center"><a class="nav-home" href="../">صفحه اصلی</a></p>
  </div>
</section>

<div id="app-header" class="top" style="display:none">
  <div class="top-inner">
    <div><h1 style="font-size:1rem">گزارش تحلیلی 5S</h1><p style="font-size:.78rem;color:#a89a86">فیلتر · بررسی سلطانی · تأیید کاظمی</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span id="user-label"></span>
      <a class="nav-home" href="./index.html">سامانه 5S</a>
      <a class="nav-home" href="../">صفحه اصلی</a>
      <button type="button" class="btn-clear" id="logout-btn">خروج</button>
    </div>
  </div>
</div>

<main id="app-main" class="wrap" style="display:none">
  <div class="card">
    <div class="hint" id="role-hint"></div>
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px">
      <strong style="color:#f5a623">همه گزارش‌ها با وضعیت گردش‌کار</strong>
      <button type="button" class="btn-excel" id="btn-excel">↓ اکسل</button>
    </div>
    <div class="filters-row">
      <div class="f"><label>از تاریخ</label><input type="date" id="f-from"></div>
      <div class="f"><label>تا تاریخ</label><input type="date" id="f-to"></div>
      <div class="f"><label>ایستگاه</label><select id="filter-ws"><option value="">همه</option></select></div>
      <div class="f"><label>ارزیاب</label><select id="filter-auditor"><option value="">همه</option></select></div>
      <div class="f"><label>نفر</label><select id="filter-operator"><option value="">همه</option></select></div>
      <div class="f"><label>وضعیت</label>
        <select id="filter-status">
          <option value="">همه</option>
          <option value="submitted">ثبت‌شده (منتظر سلطانی)</option>
          <option value="soltani_reviewed">بررسی سلطانی (منتظر کاظمی)</option>
          <option value="finalized">تأیید نهایی کاظمی</option>
        </select>
      </div>
      <button type="button" class="btn-clear" id="btn-clear-f">پاک کردن فیلتر</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>#</th><th>شماره</th><th>تاریخ</th><th>ایستگاه</th><th>ثبت‌کننده</th>
            <th>اپراتور</th><th>امتیاز</th><th>وضعیت</th><th>عملیات</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p id="empty" style="color:#a89a86;margin-top:12px;display:none">رکوردی نیست</p>
  </div>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="modal-title">گزارش</h3>
    <div id="modal-hint" class="hint"></div>
    <div id="modal-body"></div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn btn-primary" id="modal-save" hidden>ثبت بررسی</button>
      <button type="button" class="btn-clear" id="modal-close">بستن</button>
    </div>
    <p id="modal-msg" style="color:#a89a86;margin-top:8px"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rtefjfvkjpatzitjjvwe.supabase.co";
const SUPABASE_KEY="sb_publishable_RK_M3waIU7Z4jLYcs5LFqQ_7dSYHDFP";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
window.supabaseClient=supabaseClient;
let currentUser=null, currentProfile=null, allRows=[], viewRows=[], activeRow=null, activeMode="view";
const MAX_FILE=1.5*1024*1024;

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function uname(){
  const u=(currentProfile&&(currentProfile.username||currentProfile.full_name)||"").toLowerCase();
  return u;
}
function roleOf(){
  const u=uname();
  if(u.indexOf("soltani")>=0 || u.indexOf("سلطانی")>=0) return "soltani";
  if(u.indexOf("kazemi")>=0 || u.indexOf("کاظمی")>=0) return "kazemi";
  if(u.indexOf("afshar")>=0 || u.indexOf("افشار")>=0) return "afshar";
  if(u.indexOf("baba")>=0 || u.indexOf("بابا")>=0) return "baba";
  // fallback from email
  const e=(currentUser&&currentUser.email||"").toLowerCase();
  if(e.indexOf("soltani")>=0) return "soltani";
  if(e.indexOf("kazemi")>=0) return "kazemi";
  if(e.indexOf("afshar")>=0) return "afshar";
  if(e.indexOf("baba")>=0) return "baba";
  return "other";
}
function statusOf(r){
  if(r.workflow_status) return r.workflow_status;
  const w=(r.details&&r.details.workflow)||{};
  return w.status||"submitted";
}
function statusLabel(st){
  if(st==="finalized") return {t:"تأیید نهایی کاظمی",c:"badge-fin"};
  if(st==="soltani_reviewed") return {t:"بررسی سلطانی شده",c:"badge-sol"};
  return {t:"ثبت‌شده — منتظر سلطانی",c:"badge-sub"};
}
function showLogin(){document.getElementById("login-page").style.display="";document.getElementById("app-header").style.display="none";document.getElementById("app-main").style.display="none"}
function showApp(){
  document.getElementById("login-page").style.display="none";
  document.getElementById("app-header").style.display="";
  document.getElementById("app-main").style.display="";
  const r=roleOf();
  let h="";
  if(r==="soltani") h="شما <b>مهدی سلطانی</b> هستید: روی گزارش‌های «ثبت‌شده» دکمه <b>بررسی اولیه</b> را بزنید — امتیاز، کامنت و عکس مجدد.";
  else if(r==="kazemi") h="شما <b>مسعود کاظمی</b> هستید: بعد از بررسی سلطانی، دکمه <b>تأیید نهایی</b> را بزنید — امتیاز، کامنت و عکس مجدد و ثبت نهایی.";
  else if(r==="afshar"||r==="baba") h="شما ثبت‌کننده هستید. گزارش جدید را از سامانه 5S ثبت کنید. وضعیت بررسی را اینجا ببینید.";
  else h="وضعیت گردش‌کار همه گزارش‌ها را می‌بینید.";
  document.getElementById("role-hint").innerHTML=h;
}

async function loadProfile(user){
  const {data}=await supabaseClient.from("user_profiles").select("*").eq("id",user.id).maybeSingle();
  currentProfile=data;
  document.getElementById("user-label").textContent=(data&&(data.full_name||data.username))||user.email||"کاربر";
}

async function loadData(){
  const {data,error}=await supabaseClient.from("five_s_audits").select("*").order("created_at",{ascending:false}).limit(500);
  if(error){alert("خطا: "+error.message);allRows=[];viewRows=[];render();return}
  allRows=(data||[]).map(function(r){
    const total=Number(r.total_score)||0, max=Number(r.max_score)||0;
    const d=r.details||{};
    if(typeof d==="string"){ try{ r.details=JSON.parse(d);}catch(e){r.details={}} }
    const details=r.details||{};
    return {
      id:r.id, reportNo:r.report_no, date:r.audit_date||"", workstation:r.area||"",
      auditor:r.auditor||"", operator:r.operator_name||"",
      a1:r.assistant1_name||"", a2:r.assistant2_name||"", a3:r.assistant3_name||"",
      total:total, max:max, percent:max?Math.round(total*100/max):0,
      createdBy:r.created_by_name||"", sections:(details.sections)||(Array.isArray(details)?details:[]),
      details:details, workflow_status:r.workflow_status||null, raw:r
    };
  });
  fillFilterOptions(); applyFilters();
}

function unique(arr){return Array.from(new Set(arr.filter(Boolean))).sort()}
function fillFilterOptions(){
  const ws=document.getElementById("filter-ws");
  const aud=document.getElementById("filter-auditor");
  const op=document.getElementById("filter-operator");
  const wsv=ws.value,av=aud.value,ov=op.value;
  ws.innerHTML='<option value="">همه</option>';
  aud.innerHTML='<option value="">همه</option>';
  op.innerHTML='<option value="">همه</option>';
  unique(allRows.map(r=>r.workstation)).forEach(function(v){const o=document.createElement("option");o.value=v;o.textContent=v;ws.appendChild(o)});
  unique(allRows.map(r=>r.auditor)).forEach(function(v){const o=document.createElement("option");o.value=v;o.textContent=v;aud.appendChild(o)});
  const people=[]; allRows.forEach(function(r){[r.operator,r.a1,r.a2,r.a3].forEach(function(n){if(n)people.push(n)})});
  unique(people).forEach(function(v){const o=document.createElement("option");o.value=v;o.textContent=v;op.appendChild(o)});
  ws.value=wsv;aud.value=av;op.value=ov;
}

function applyFilters(){
  const from=document.getElementById("f-from").value;
  const to=document.getElementById("f-to").value;
  const ws=document.getElementById("filter-ws").value;
  const aud=document.getElementById("filter-auditor").value;
  const op=document.getElementById("filter-operator").value;
  const st=document.getElementById("filter-status").value;
  viewRows=allRows.filter(function(r){
    if(from&&(r.date||"")<from)return false;
    if(to&&(r.date||"")>to)return false;
    if(ws&&r.workstation!==ws)return false;
    if(aud&&r.auditor!==aud)return false;
    if(op&&[r.operator,r.a1,r.a2,r.a3].indexOf(op)<0)return false;
    if(st&&statusOf(r)!==st)return false;
    return true;
  });
  render();
}

function render(){
  const tb=document.getElementById("tbody");
  const empty=document.getElementById("empty");
  const kpis=document.getElementById("kpis");
  tb.innerHTML="";
  if(!viewRows.length){empty.style.display="";kpis.innerHTML="";return}
  empty.style.display="none";
  const nSub=viewRows.filter(r=>statusOf(r)==="submitted").length;
  const nSol=viewRows.filter(r=>statusOf(r)==="soltani_reviewed").length;
  const nFin=viewRows.filter(r=>statusOf(r)==="finalized").length;
  kpis.innerHTML=
    '<div class="kpi"><div class="n">'+viewRows.length+'</div><div class="l">نمایش‌داده‌شده</div></div>'+
    '<div class="kpi"><div class="n">'+nSub+'</div><div class="l">منتظر سلطانی</div></div>'+
    '<div class="kpi"><div class="n">'+nSol+'</div><div class="l">منتظر کاظمی</div></div>'+
    '<div class="kpi"><div class="n">'+nFin+'</div><div class="l">نهایی‌شده</div></div>';
  const role=roleOf();
  viewRows.forEach(function(r,i){
    const st=statusOf(r); const sl=statusLabel(st);
    let acts='<button type="button" class="btn-act btn-view" data-i="'+i+'" data-m="view">مشاهده</button>';
    if(role==="soltani" && st==="submitted"){
      acts+='<button type="button" class="btn-act btn-rev" data-i="'+i+'" data-m="soltani">بررسی اولیه</button>';
    }
    if(role==="kazemi" && st==="soltani_reviewed"){
      acts+='<button type="button" class="btn-act btn-fin" data-i="'+i+'" data-m="kazemi">تأیید نهایی</button>';
    }
    // allow soltani/kazemi also view previous reviews
    const tr=document.createElement("tr");
    tr.innerHTML='<td>'+(i+1)+'</td><td>'+esc(r.reportNo)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.workstation)+'</td><td>'+esc(r.createdBy||r.auditor)+'</td><td>'+esc(r.operator)+'</td><td>'+r.total+'/'+r.max+'</td><td><span class="badge '+sl.c+'">'+sl.t+'</span></td><td>'+acts+'</td>';
    tb.appendChild(tr);
  });
  tb.querySelectorAll(".btn-act").forEach(function(btn){
    btn.onclick=function(){ openModal(viewRows[Number(btn.getAttribute("data-i"))], btn.getAttribute("data-m")); };
  });
}

function sectionsFrom(r){
  // prefer last review sections for display baseline
  const w=(r.details&&r.details.workflow)||{};
  if(activeMode==="kazemi" && w.soltani_review && w.soltani_review.sections) return w.soltani_review.sections;
  if(r.sections && r.sections.length) return r.sections;
  return [];
}

function openModal(r, mode){
  activeRow=r; activeMode=mode||"view";
  document.getElementById("modal").hidden=false;
  document.getElementById("modal-msg").textContent="";
  const st=statusOf(r);
  const title=document.getElementById("modal-title");
  const hint=document.getElementById("modal-hint");
  const save=document.getElementById("modal-save");
  save.hidden = !(mode==="soltani"||mode==="kazemi");
  if(mode==="soltani"){
    title.textContent="بررسی اولیه — گزارش #"+(r.reportNo||"-");
    hint.innerHTML="برای هر آیتم می‌توانید <b>امتیاز مجدد</b>، <b>کامنت</b> و در صورت نیاز <b>عکس</b> بگذارید و ثبت کنید.";
    save.textContent="ثبت بررسی مهدی سلطانی";
  } else if(mode==="kazemi"){
    title.textContent="تأیید نهایی — گزارش #"+(r.reportNo||"-");
    hint.innerHTML="پس از بررسی سلطانی هستید. امتیاز/کامنت/عکس را در صورت نیاز اصلاح و <b>ثبت نهایی</b> کنید.";
    save.textContent="ثبت نهایی مسعود کاظمی";
  } else {
    title.textContent="مشاهده گزارش #"+(r.reportNo||"-")+" — "+statusLabel(st).t;
    hint.textContent="حالت فقط مشاهده";
  }
  renderModalBody(r, mode);
}

function renderModalBody(r, mode){
  const body=document.getElementById("modal-body");
  const w=(r.details&&r.details.workflow)||{};
  let html='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px">';
  html+='<div class="item-box"><div class="orig">تاریخ</div><b>'+esc(r.date)+'</b></div>';
  html+='<div class="item-box"><div class="orig">ایستگاه</div><b>'+esc(r.workstation)+'</b></div>';
  html+='<div class="item-box"><div class="orig">اپراتور</div><b>'+esc(r.operator)+'</b></div>';
  html+='<div class="item-box"><div class="orig">امتیاز ثبت اولیه</div><b>'+r.total+' / '+r.max+'</b></div>';
  html+='</div>';

  if(w.soltani_review){
    html+='<div class="hint">بررسی سلطانی: امتیاز '+(w.soltani_review.total!=null?w.soltani_review.total:"-")+' — '+esc(w.soltani_review.at||"")+'</div>';
  }
  if(w.kazemi_review){
    html+='<div class="hint">تأیید کاظمی: امتیاز '+(w.kazemi_review.total!=null?w.kazemi_review.total:"-")+' — '+esc(w.kazemi_review.at||"")+'</div>';
  }

  const secs=sectionsFrom(r);
  const editable=(mode==="soltani"||mode==="kazemi");
  secs.forEach(function(sec,si){
    html+='<div class="sec-title">'+esc(sec.title||sec.name||("بخش "+(si+1)))+'</div>';
    (sec.items||[]).forEach(function(it,ii){
      const q=it.question||it.label||"";
      const baseScore=it.score!=null?it.score:0;
      const baseNote=it.note||"";
      html+='<div class="item-box" data-si="'+si+'" data-ii="'+ii+'">';
      html+='<div class="q">'+(ii+1)+'- '+esc(q)+'</div>';
      html+='<div class="orig">ثبت اولیه / مبنا: نمره '+baseScore+(baseNote?' — '+esc(baseNote):'')+'</div>';
      if(it.fileData && it.fileType && String(it.fileType).indexOf("image/")===0){
        html+='<div class="orig">عکس قبلی:</div><img class="thumb" src="'+it.fileData+'" alt="">';
      }
      if(editable){
        html+='<div class="item-grid">';
        html+='<div><label>امتیاز مجدد (0-5)</label><input type="number" min="0" max="5" class="rv-score" value="'+baseScore+'"></div>';
        html+='<div><label>کامنت</label><input type="text" class="rv-note" value="'+esc(baseNote)+'"></div>';
        html+='</div>';
        html+='<div style="margin-top:8px"><label>عکس مجدد (اختیاری)</label><input type="file" accept="image/*" class="rv-file"><div class="rv-preview"></div></div>';
      } else {
        html+='<div>نمره: <b>'+baseScore+'</b>'+(baseNote?' — '+esc(baseNote):'')+'</div>';
      }
      html+='</div>';
    });
  });
  if(!secs.length) html+='<p style="color:#a89a86">جزئیات آیتم‌ها در این گزارش موجود نیست.</p>';
  body.innerHTML=html;

  if(editable){
    body.querySelectorAll(".rv-file").forEach(function(inp){
      inp.onchange=function(){
        const file=inp.files&&inp.files[0];
        const box=inp.closest(".item-box");
        const prev=box.querySelector(".rv-preview");
        box._file=null;
        prev.innerHTML="";
        if(!file) return;
        if(file.size>MAX_FILE){alert("حجم عکس بیشتر از ۱٫۵ مگابایت است");inp.value="";return;}
        const reader=new FileReader();
        reader.onload=function(){
          box._file={name:file.name,type:file.type,dataUrl:reader.result};
          prev.innerHTML='<img class="thumb" src="'+reader.result+'" alt=""> '+esc(file.name);
        };
        reader.readAsDataURL(file);
      };
    });
  }
}

document.getElementById("modal-close").onclick=function(){document.getElementById("modal").hidden=true};
document.getElementById("modal-save").onclick=async function(){
  if(!activeRow||(activeMode!=="soltani"&&activeMode!=="kazemi")) return;
  const boxes=document.querySelectorAll("#modal-body .item-box[data-si]");
  const baseSecs=JSON.parse(JSON.stringify(sectionsFrom(activeRow)));
  let total=0;
  boxes.forEach(function(box){
    const si=Number(box.getAttribute("data-si"));
    const ii=Number(box.getAttribute("data-ii"));
    if(!baseSecs[si]||!baseSecs[si].items||!baseSecs[si].items[ii]) return;
    const scoreEl=box.querySelector(".rv-score");
    const noteEl=box.querySelector(".rv-note");
    const score=Number(scoreEl&&scoreEl.value)||0;
    const note=(noteEl&&noteEl.value)||"";
    total+=score;
    const it=baseSecs[si].items[ii];
    it.score=score;
    it.note=note;
    it.done=score>0;
    if(box._file){
      it.fileName=box._file.name;
      it.fileType=box._file.type;
      it.fileData=box._file.dataUrl;
    }
  });
  const details=Object.assign({}, activeRow.details||{});
  if(!details.sections) details.sections=activeRow.sections||[];
  const workflow=Object.assign({}, details.workflow||{});
  const now=new Date().toISOString();
  const who=(currentProfile&&(currentProfile.full_name||currentProfile.username))||"";
  if(activeMode==="soltani"){
    workflow.status="soltani_reviewed";
    workflow.soltani_review={by:who,at:now,sections:baseSecs,total:total};
  } else {
    workflow.status="finalized";
    workflow.kazemi_review={by:who,at:now,sections:baseSecs,total:total};
  }
  details.workflow=workflow;
  document.getElementById("modal-msg").textContent="در حال ذخیره...";
  const payload={ details: details, workflow_status: workflow.status };
  if(activeMode==="soltani") payload.soltani_reviewed_at=now;
  if(activeMode==="kazemi") payload.kazemi_finalized_at=now;
  // if columns missing, still try details-only
  let {error}=await supabaseClient.from("five_s_audits").update(payload).eq("id", activeRow.id);
  if(error){
    // retry without extra columns
    const retry=await supabaseClient.from("five_s_audits").update({ details: details }).eq("id", activeRow.id);
    error=retry.error;
  }
  if(error){document.getElementById("modal-msg").textContent="";alert(error.message);return;}
  document.getElementById("modal-msg").textContent="ذخیره شد";
  document.getElementById("modal").hidden=true;
  await loadData();
};

document.getElementById("btn-excel").onclick=function(){
  if(!viewRows.length){alert("رکوردی نیست");return;}
  function cell(v){let t=String(v==null?"":v);return '"'+t.replace(/"/g,'""')+'"'}
  const headers=["ردیف","شماره","تاریخ","ایستگاه","ثبت‌کننده","اپراتور","امتیاز","حداکثر","وضعیت"];
  const rows=viewRows.map(function(r,i){return [i+1,r.reportNo,r.date,r.workstation,r.createdBy,r.operator,r.total,r.max,statusLabel(statusOf(r)).t]});
  const csv=[headers].concat(rows).map(function(r){return r.map(cell).join(",")}).join("\r\n");
  const blob=new Blob(["\uFEFF",csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="5S_workflow.csv";a.click();
};
document.getElementById("logout-btn").onclick=async function(){await supabaseClient.auth.signOut();location.replace("../")};
document.getElementById("login-form").onsubmit=async function(e){
  e.preventDefault();
  try{
    const u=document.getElementById("loginUser").value,p=document.getElementById("loginPass").value;
    const {data,error}=await supabaseClient.auth.signInWithPassword({email:u+"@people-manager.invalid",password:p});
    if(error)throw error;
    currentUser=data.user; await loadProfile(currentUser); showApp(); await loadData();
  }catch(err){document.getElementById("login-error").textContent=err.message||"خطا"}
};

(async function(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session&&session.user){
    currentUser=session.user;
    await loadProfile(currentUser);
    showApp();
    await loadData();
  } else showLogin();
})();
