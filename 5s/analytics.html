<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش ارزیابی 5S</title><script src="../gate.js?v=1"></script><style>
*{box-sizing:border-box}body{margin:0;background:#14110c;color:#f5f0e8;font-family:Tahoma,sans-serif;line-height:1.8}[hidden]{display:none!important}.wrap{max-width:1600px;margin:auto;padding:20px 16px}.top,.filters,.actions-row,.card-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top{padding:14px 20px;border-bottom:1px solid #4a4030;justify-content:space-between}.top h1{margin:0;font-size:20px;color:#f5a623}a{color:#f5a623}button,input,select{font:inherit;border:1px solid #66553e;border-radius:8px;padding:9px;background:#211b13;color:inherit}button{cursor:pointer}.btn-primary{background:#f5a623;color:#14110c;font-weight:bold}.filters,.actions-row{margin-bottom:16px}.filters label{display:flex;flex-direction:column;font-size:13px}.filters input,.filters select{min-width:150px}.card{border:1px solid #4a4030;border-radius:10px;overflow:hidden}.card-head{padding:12px;background:#2e261c;justify-content:space-between}.card-head h3{margin:0;color:#f5a623}.hint{font-size:12px;color:#cbbfaa}.empty{padding:30px;text-align:center}.login{max-width:380px;margin:70px auto;padding:24px;border:1px solid #4a4030;border-radius:12px}.login label{display:block;margin:12px 0}.login input,.login select{width:100%}#status{min-height:25px;color:#fcd34d}#kpis{margin-bottom:12px}button:disabled{opacity:.5;cursor:wait}</style></head><body>
<section class="login" id="login" hidden><h2>ورود به گزارش 5S</h2><form id="login-form"><label>نام کاربری<select id="username" required><option value="">انتخاب کاربر</option><option value="mehdi-soltani">مهدی سلطانی</option><option value="masoud-kazemi">مسعود کاظمی</option><option value="mehdi-afshar">مهدی افشار</option><option value="arash-baba">آرش بابا</option></select></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button class="btn-primary">ورود</button><p id="login-error" role="alert"></p></form></section>
<div id="app" hidden><header class="top"><h1>گزارش ارزیابی 5S</h1><nav><a href="./">مدیریت 5S</a> | <a href="../">صفحه اصلی</a> <button id="logout">خروج</button></nav></header><main class="wrap"><div class="filters"><label>از تاریخ<input id="from" type="date"></label><label>تا تاریخ<input id="to" type="date"></label><label>ایستگاه<select id="station"><option value="">همه ایستگاه‌ها</option></select></label><label>ارزیاب<select id="auditor"><option value="">همه ارزیاب‌ها</option></select></label><button id="apply">اعمال فیلتر</button><button id="reset">پاک کردن فیلتر</button></div><div class="actions-row"><button id="refresh">بروزرسانی</button></div><p id="status" role="status">در حال بررسی ورود...</p><div id="kpis"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=window.supabase.createClient('https://rtefjfvkjpatzitjjvwe.supabase.co','sb_publishable_RK_M3waIU7Z4jLYcs5LFqQ_7dSYHDFP');
let allRows=[],filtered=[];const el=id=>document.getElementById(id);
function renderAll(){el('kpis').textContent='تعداد ارزیابی: '+filtered.length;}
function showSession(session){el('login').hidden=!!session;el('app').hidden=!session;}
function apply(){filtered=allRows.filter(r=>(!el('from').value||(r.date&&r.date>=el('from').value))&&(!el('to').value||(r.date&&r.date<=el('to').value))&&(!el('station').value||r.workstation===el('station').value)&&(!el('auditor').value||r.auditor===el('auditor').value));renderAll();}
function options(id,key,label){const s=el(id),previous=s.value;s.replaceChildren(new Option(label,''));[...new Set(allRows.map(r=>r[key]).filter(Boolean))].sort().forEach(v=>s.add(new Option(v,v)));s.value=previous;}
async function load(){el('status').textContent='در حال دریافت گزارش‌ها...';el('refresh').disabled=true;try{const rows=[];for(let start=0;;start+=500){const {data,error}=await client.from('five_s_audits').select('*').order('created_at',{ascending:false}).order('id').range(start,start+499);if(error)throw error;rows.push(...(data||[]));if(!data||data.length<500)break;}allRows=rows.map(r=>({id:r.id,reportNo:r.report_no,date:r.audit_date||'',workstation:r.area||'',auditor:r.auditor||'',operator:r.operator_name||'',assistants:[r.assistant1_name,r.assistant2_name,r.assistant3_name].filter(Boolean),sections:(r.details||{}).sections||[]}));options('station','workstation','همه ایستگاه‌ها');options('auditor','auditor','همه ارزیاب‌ها');apply();el('status').textContent='';}catch(e){allRows=[];filtered=[];renderAll();el('status').textContent='خواندن گزارش ناموفق بود: '+e.message;}finally{el('refresh').disabled=false;}}
el('apply').onclick=apply;el('reset').onclick=()=>{['from','to','station','auditor'].forEach(id=>el(id).value='');apply();};el('refresh').onclick=load;
el('login-form').onsubmit=async e=>{e.preventDefault();el('login-error').textContent='در حال ورود...';try{const {data,error}=await client.auth.signInWithPassword({email:el('username').value+'@people-manager.invalid',password:el('password').value});if(error)throw error;el('password').value='';el('login-error').textContent='';showSession(data.session);await load();}catch(err){el('login-error').textContent='ورود ناموفق: '+err.message;}};
el('logout').onclick=async()=>{const {error}=await client.auth.signOut();if(error){el('status').textContent=error.message;return;}allRows=[];filtered=[];renderAll();showSession(null);};
window.addEventListener('DOMContentLoaded',async()=>{try{const {data,error}=await client.auth.getSession();if(error)throw error;showSession(data.session);if(data.session)await load();}catch(e){showSession(null);el('login-error').textContent=e.message;}});
</script><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script src="analytics-template.js?v=1"></script></body></html>
