<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script src="../gate.js?v=3"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5a623">
<title>گزارش تحلیلی 5S | APW</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#0f0d0a;color:#f5f0e8;min-height:100vh;line-height:1.7}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-box{width:100%;max-width:400px;background:linear-gradient(145deg,#2a2318,#1a1610);border:1px solid #3d3428;border-radius:18px;padding:28px 22px}
.login-box h1{font-size:1.2rem;margin:12px 0 6px;text-align:center}
.login-box .sub{text-align:center;color:#a89a86;font-size:.9rem;margin-bottom:18px}
.login-field{margin-bottom:12px}
.login-field label{display:block;font-size:.85rem;color:#a89a86;margin-bottom:4px}
.login-field select,.login-field input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #4a4030;background:#1a1610;color:#f5f0e8;font-family:inherit}
.login-error{color:#f87171;font-size:.85rem;margin-top:10px;min-height:1.2em}
.btn{border:none;border-radius:12px;padding:11px 18px;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#f5a623,#e8910f);color:#1a1208}
.nav-home{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f5a623,#e8910f);color:#1a1208!important;font-weight:800;font-size:.88rem;padding:10px 16px;border-radius:12px;text-decoration:none;box-shadow:0 6px 18px rgba(245,166,35,.3)}
.top{position:sticky;top:0;z-index:10;background:rgba(15,13,10,.94);border-bottom:1px solid #3d3428;padding:12px 16px}
.top-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1rem;font-weight:800}.brand p{font-size:.78rem;color:#a89a86}
.user-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.card{background:linear-gradient(145deg,#2a2318,#1a1610);border:1px solid #3d3428;border-radius:16px;padding:16px;margin-bottom:16px}
.filters-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px;padding-top:4px}
.filters-row .f{display:flex;flex-direction:column;gap:4px}
.filters-row .f label{font-size:.75rem;color:#a89a86}
.filters-row input[type=date],.filters-row select{padding:10px 12px;border-radius:12px;border:1px solid #4a4030;background:#14110c;color:#f5f0e8;font-family:inherit;font-size:.88rem;min-width:140px}
.btn-clear{background:#2a2418;border:1px solid #5a4030;color:#f5c56a;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:700;cursor:pointer}
.btn-excel{background:transparent;border:1px solid #f5a623;color:#f5a623;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#14110c;border:1px solid #3d3428;border-radius:12px;padding:12px;text-align:center}
.kpi .n{font-size:1.4rem;font-weight:800;color:#f5a623}
.kpi .l{font-size:.78rem;color:#a89a86}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:10px 8px;border-bottom:1px solid #2a2418;text-align:right}
th{color:#f5a623;position:sticky;top:0;background:#1a1610}
.score-good{color:#4ade80;font-weight:700}.score-mid{color:#fcd34d;font-weight:700}.score-low{color:#f87171;font-weight:700}
.btn-view,.btn-edit{background:#2a2418;border:1px solid #5a4030;color:#f5c56a;border-radius:8px;padding:6px 12px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;margin-left:4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none!important}
.modal-box{width:100%;max-width:820px;max-height:90vh;overflow:auto;background:linear-gradient(160deg,#1e1a14,#16120e);border:1px solid #3d3428;border-radius:18px;padding:20px}
.modal-box h3{color:#f5a623;font-size:1.15rem;margin-bottom:12px}
.modal-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.modal-meta .item{background:#14110c;border:1px solid #3d3428;border-radius:10px;padding:10px}
.modal-meta .lbl{font-size:.75rem;color:#a89a86}.modal-meta .val{font-weight:700;font-size:.92rem}
.edit-field{margin-bottom:10px}.edit-field label{display:block;font-size:.78rem;color:#a89a86;margin-bottom:4px}
.edit-field input,.edit-field select,.edit-field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #4a4030;background:#14110c;color:#f5f0e8;font-family:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<section id="login-page" class="login-page" style="display:none">
  <div class="login-box">
    <h1>گزارش تحلیلی 5S</h1>
    <p class="sub">ورود از صفحه اصلی انجام می‌شود</p>
    <form id="login-form">
      <div class="login-field"><label>نام کاربری</label>
        <select id="loginUser" required>
          <option value="">—</option>
          <option value="mehdi-soltani">مهدی سلطانی</option>
          <option value="masoud-kazemi">مسعود کاظمی</option>
          <option value="mehdi-afshar">مهدی افشار</option>
          <option value="arash-baba">آرش بابا</option>
        </select>
      </div>
      <div class="login-field"><label>رمز عبور</label><input id="loginPass" type="password" required></div>
      <button class="btn btn-primary" type="submit">ورود</button>
      <p id="login-error" class="login-error"></p>
    </form>
    <p style="margin-top:12px;text-align:center"><a class="nav-home" href="../">صفحه اصلی</a></p>
  </div>
</section>

<div id="app-header" class="top" style="display:none">
  <div class="top-inner">
    <div class="brand"><div><h1>گزارش تحلیلی 5S</h1><p>فیلتر · مشاهده · ویرایش · اکسل</p></div></div>
    <div class="user-bar">
      <span id="user-label"></span>
      <a class="nav-home" href="./index.html">→ سامانه 5S</a>
      <a class="nav-home" href="../">صفحه اصلی</a>
      <button type="button" class="btn-clear" id="logout-btn">خروج</button>
    </div>
  </div>
</div>

<main id="app-main" class="wrap" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px">
      <div>
        <strong style="color:#f5a623">همه گزارش‌های ثبت‌شده</strong>
        <p class="sub" style="color:#a89a86;font-size:.85rem;margin:0">جست‌وجو، فیلتر و خروجی اکسل</p>
      </div>
      <button type="button" class="btn-excel" id="btn-excel">↓ خروجی اکسل</button>
    </div>
    <div class="filters-row">
      <div class="f"><label>از تاریخ</label><input type="date" id="f-from"></div>
      <div class="f"><label>تا تاریخ</label><input type="date" id="f-to"></div>
      <div class="f"><label>ایستگاه کاری</label><select id="filter-ws"><option value="">همه ایستگاه‌ها</option></select></div>
      <div class="f"><label>ارزیاب</label><select id="filter-auditor"><option value="">همه ارزیاب‌ها</option></select></div>
      <div class="f"><label>نفر (اپراتور / کمک)</label><select id="filter-operator"><option value="">همه نفرات</option></select></div>
      <button type="button" class="btn-clear" id="btn-clear-f">پاک کردن فیلترها</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>ردیف</th><th>شماره</th><th>تاریخ</th><th>ایستگاه</th><th>ارزیاب</th>
            <th>اپراتور</th><th>کمک۱</th><th>کمک۲</th><th>کمک۳</th>
            <th>امتیاز</th><th>درصد</th><th>ثبت‌کننده</th><th>عملیات</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p id="empty" style="color:#a89a86;margin-top:12px;display:none">رکوردی با این فیلتر نیست</p>
  </div>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="modal-title">جزئیات گزارش</h3>
    <div id="modal-meta" class="modal-meta"></div>
    <div id="modal-body"></div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn btn-primary" id="modal-save" hidden>ذخیره اصلاحات</button>
      <button type="button" class="btn-clear" id="modal-close">بستن</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rtefjfvkjpatzitjjvwe.supabase.co";
const SUPABASE_KEY="sb_publishable_RK_M3waIU7Z4jLYcs5LFqQ_7dSYHDFP";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
window.supabaseClient=supabaseClient;
let currentUser=null,currentProfile=null,allRows=[],viewRows=[],editRow=null;

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function showLogin(){document.getElementById("login-page").style.display="";document.getElementById("app-header").style.display="none";document.getElementById("app-main").style.display="none"}
function showApp(){document.getElementById("login-page").style.display="none";document.getElementById("app-header").style.display="";document.getElementById("app-main").style.display=""}

async function loadProfile(user){
  const {data}=await supabaseClient.from("user_profiles").select("*").eq("id",user.id).maybeSingle();
  currentProfile=data;
  document.getElementById("user-label").textContent=(data&&(data.full_name||data.username))||user.email||"کاربر";
}

async function loadData(){
  const {data,error}=await supabaseClient.from("five_s_audits").select("*").order("created_at",{ascending:false}).limit(500);
  if(error){alert("خطا در خواندن: "+error.message);allRows=[];viewRows=[];render();return}
  allRows=(data||[]).map(function(r){
    const total=Number(r.total_score)||0, max=Number(r.max_score)||0;
    const d=r.details||{};
    return {
      id:r.id, reportNo:r.report_no, date:r.audit_date||"", workstation:r.area||"",
      auditor:r.auditor||"", operator:r.operator_name||"",
      a1:r.assistant1_name||"", a2:r.assistant2_name||"", a3:r.assistant3_name||"",
      total:total, max:max, percent:max?Math.round(total*100/max):0,
      createdBy:r.created_by_name||"", sections:d.sections||[], raw:r
    };
  });
  fillFilterOptions();
  applyFilters();
}

function unique(arr){return Array.from(new Set(arr.filter(Boolean))).sort()}
function fillFilterOptions(){
  const ws=document.getElementById("filter-ws");
  const aud=document.getElementById("filter-auditor");
  const op=document.getElementById("filter-operator");
  const wsv=ws.value, av=aud.value, ov=op.value;
  ws.innerHTML='<option value="">همه ایستگاه‌ها</option>';
  aud.innerHTML='<option value="">همه ارزیاب‌ها</option>';
  op.innerHTML='<option value="">همه نفرات</option>';
  unique(allRows.map(r=>r.workstation)).forEach(function(v){const o=document.createElement("option");o.value=v;o.textContent=v;ws.appendChild(o)});
  unique(allRows.map(r=>r.auditor)).forEach(function(v){const o=document.createElement("option");o.value=v;o.textContent=v;aud.appendChild(o)});
  const people=[];
  allRows.forEach(function(r){[r.operator,r.a1,r.a2,r.a3].forEach(function(n){if(n)people.push(n)})});
  unique(people).forEach(function(v){const o=document.createElement("option");o.value=v;o.textContent=v;op.appendChild(o)});
  ws.value=wsv; aud.value=av; op.value=ov;
}

function applyFilters(){
  const from=document.getElementById("f-from").value;
  const to=document.getElementById("f-to").value;
  const ws=document.getElementById("filter-ws").value;
  const aud=document.getElementById("filter-auditor").value;
  const op=document.getElementById("filter-operator").value;
  viewRows=allRows.filter(function(r){
    if(from && (r.date||"") < from) return false;
    if(to && (r.date||"") > to) return false;
    if(ws && r.workstation!==ws) return false;
    if(aud && r.auditor!==aud) return false;
    if(op){
      const names=[r.operator,r.a1,r.a2,r.a3];
      if(names.indexOf(op)<0) return false;
    }
    return true;
  });
  render();
}

function render(){
  const tb=document.getElementById("tbody");
  const empty=document.getElementById("empty");
  const kpis=document.getElementById("kpis");
  tb.innerHTML="";
  if(!viewRows.length){empty.style.display="";kpis.innerHTML="";return}
  empty.style.display="none";
  const avg=viewRows.reduce(function(a,r){return a+r.percent},0)/viewRows.length;
  kpis.innerHTML=
    '<div class="kpi"><div class="n">'+viewRows.length+'</div><div class="l">تعداد گزارش</div></div>'+
    '<div class="kpi"><div class="n">'+Math.round(avg)+'%</div><div class="l">میانگین درصد</div></div>'+
    '<div class="kpi"><div class="n">'+unique(viewRows.map(r=>r.operator)).length+'</div><div class="l">اپراتور یکتا</div></div>'+
    '<div class="kpi"><div class="n">'+unique(viewRows.map(r=>r.workstation)).length+'</div><div class="l">ایستگاه یکتا</div></div>';
  viewRows.forEach(function(r,i){
    const sc=r.percent>=80?"score-good":(r.percent>=50?"score-mid":"score-low");
    const tr=document.createElement("tr");
    tr.innerHTML='<td>'+(i+1)+'</td><td>'+esc(r.reportNo)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.workstation)+'</td><td>'+esc(r.auditor)+'</td><td>'+esc(r.operator)+'</td><td>'+esc(r.a1)+'</td><td>'+esc(r.a2)+'</td><td>'+esc(r.a3)+'</td><td class="'+sc+'">'+r.total+' / '+r.max+'</td><td class="'+sc+'">'+r.percent+'%</td><td>'+esc(r.createdBy)+'</td><td><button type="button" class="btn-view" data-i="'+i+'">مشاهده</button><button type="button" class="btn-edit" data-i="'+i+'">ویرایش</button></td>';
    tb.appendChild(tr);
  });
  tb.querySelectorAll(".btn-view").forEach(function(btn){btn.onclick=function(){openDetail(viewRows[Number(btn.getAttribute("data-i"))],false)}});
  tb.querySelectorAll(".btn-edit").forEach(function(btn){btn.onclick=function(){openDetail(viewRows[Number(btn.getAttribute("data-i"))],true)}});
}

function openDetail(r,edit){
  editRow=r;
  document.getElementById("modal").hidden=false;
  document.getElementById("modal-title").textContent=(edit?"ویرایش":"مشاهده")+" گزارش #"+(r.reportNo||"-");
  document.getElementById("modal-save").hidden=!edit;
  function meta(l,v){return '<div class="item"><div class="lbl">'+l+'</div><div class="val">'+esc(v)+'</div></div>'}
  document.getElementById("modal-meta").innerHTML=meta("تاریخ",r.date)+meta("ایستگاه",r.workstation)+meta("ارزیاب",r.auditor)+meta("اپراتور",r.operator)+meta("امتیاز",r.total+" / "+r.max)+meta("درصد",r.percent+"%");
  const body=document.getElementById("modal-body");
  if(!edit){
    let h="";
    (r.sections||[]).forEach(function(sec){
      h+='<div style="margin:12px 0 6px;color:#f5a623;font-weight:800">'+esc(sec.title||sec.name||"")+'</div>';
      (sec.items||[]).forEach(function(it,ii){
        h+='<div style="padding:8px 0;border-bottom:1px solid #2a2418">'+(ii+1)+'- '+esc(it.question||it.label||"")+' — نمره: <b>'+(it.score!=null?it.score:"-")+'</b>'+(it.note?' — '+esc(it.note):'')+'</div>';
      });
    });
    body.innerHTML=h||"<p style='color:#a89a86'>جزئیاتی ثبت نشده</p>";
    return;
  }
  let html='<div class="edit-field"><label>تاریخ</label><input type="date" id="e-date" value="'+esc(r.date||"")+'"></div>';
  html+='<div class="edit-field"><label>ایستگاه</label><input type="text" id="e-ws" value="'+esc(r.workstation||"")+'"></div>';
  html+='<div class="edit-field"><label>ارزیاب</label><input type="text" id="e-auditor" value="'+esc(r.auditor||"")+'"></div>';
  html+='<div class="edit-field"><label>اپراتور</label><input type="text" id="e-op" value="'+esc(r.operator||"")+'"></div>';
  html+='<div class="edit-field"><label>کمک۱</label><input type="text" id="e-a1" value="'+esc(r.a1||"")+'"></div>';
  html+='<div class="edit-field"><label>کمک۲</label><input type="text" id="e-a2" value="'+esc(r.a2||"")+'"></div>';
  html+='<div class="edit-field"><label>کمک۳</label><input type="text" id="e-a3" value="'+esc(r.a3||"")+'"></div>';
  body.innerHTML=html;
}

document.getElementById("modal-close").onclick=function(){document.getElementById("modal").hidden=true};
document.getElementById("modal-save").onclick=async function(){
  if(!editRow) return;
  const payload={
    audit_date: document.getElementById("e-date").value||null,
    area: document.getElementById("e-ws").value||null,
    auditor: document.getElementById("e-auditor").value||null,
    operator_name: document.getElementById("e-op").value||null,
    assistant1_name: document.getElementById("e-a1").value||null,
    assistant2_name: document.getElementById("e-a2").value||null,
    assistant3_name: document.getElementById("e-a3").value||null
  };
  const {error}=await supabaseClient.from("five_s_audits").update(payload).eq("id", editRow.id);
  if(error) return alert(error.message);
  document.getElementById("modal").hidden=true;
  await loadData();
};

["f-from","f-to","filter-ws","filter-auditor","filter-operator"].forEach(function(id){
  document.getElementById(id).addEventListener("change", applyFilters);
});
document.getElementById("btn-clear-f").onclick=function(){
  document.getElementById("f-from").value="";
  document.getElementById("f-to").value="";
  document.getElementById("filter-ws").value="";
  document.getElementById("filter-auditor").value="";
  document.getElementById("filter-operator").value="";
  applyFilters();
};
document.getElementById("btn-excel").onclick=function(){
  if(!viewRows.length){alert("رکوردی برای خروجی نیست.");return}
  function cell(v){let t=String(v==null?"":v);if(/^[\s]*[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}
  const headers=["ردیف","شماره","تاریخ","ایستگاه","ارزیاب","اپراتور","کمک1","کمک2","کمک3","امتیاز","حداکثر","درصد","ثبت‌کننده"];
  const rows=viewRows.map(function(r,i){return [i+1,r.reportNo,r.date,r.workstation,r.auditor,r.operator,r.a1,r.a2,r.a3,r.total,r.max,r.percent,r.createdBy]});
  const csv=[headers].concat(rows).map(function(r){return r.map(cell).join(",")}).join("\r\n");
  const blob=new Blob(["\uFEFF",csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="5S_Reports_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();a.remove();
};
document.getElementById("logout-btn").onclick=async function(){await supabaseClient.auth.signOut();location.replace("../")};
document.getElementById("login-form").onsubmit=async function(e){
  e.preventDefault();
  try{
    const u=document.getElementById("loginUser").value,p=document.getElementById("loginPass").value;
    const {data,error}=await supabaseClient.auth.signInWithPassword({email:u+"@people-manager.invalid",password:p});
    if(error)throw error;
    currentUser=data.user; await loadProfile(currentUser); showApp(); await loadData();
  }catch(err){document.getElementById("login-error").textContent=err.message||"خطا"}
};

(async function(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session&&session.user){
    currentUser=session.user;
    await loadProfile(currentUser);
    showApp();
    await loadData();
  } else showLogin();
})();
</script>
</body>
</html>
