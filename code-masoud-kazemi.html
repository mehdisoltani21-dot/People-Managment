<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>ورود مسعود کاظمی | APW</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Vazirmatn,Tahoma,sans-serif;background:#14110c;color:#f5f0e8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    .card{width:100%;max-width:360px;background:linear-gradient(145deg,#2a2318,#1a1610);border:1px solid #3d3428;border-radius:18px;padding:28px 20px;text-align:center}
    h1{font-size:1.35rem;color:#f5a623;margin-bottom:6px}
    .role{font-size:.9rem;color:#a89a86;margin-bottom:18px}
    .qr-wrap{display:flex;justify-content:center;align-items:center;background:#fff;border-radius:12px;padding:12px;margin:0 auto 16px;width:220px;height:220px}
    .qr-wrap img{width:196px;height:196px;display:block}
    .open-btn{display:block;width:100%;padding:15px 16px;background:#f5a623;color:#1a1208;font-weight:800;border-radius:12px;text-decoration:none;font-size:1.1rem}
    .hint{margin-top:14px;font-size:.8rem;color:#a89a86;line-height:1.7}
  </style>
</head>
<body>
  <div class="card">
    <h1>مسعود کاظمی</h1>
    <div class="role">ورود مستقیم به حساب</div>
    <div class="qr-wrap">
      <img alt="QR" width="196" height="196" src="https://api.qrserver.com/v1/create-qr-code/?size=196x196&margin=8&data=https%3A%2F%2Fmehdisoltani21-dot.github.io%2FPeople-Managment%2Fpanel%2F%3Ft%3Dapw-mk-p3w9x1" onerror="this.parentNode.innerHTML='<span style=color:#333;font-size:13px>از دکمه زیر استفاده کنید</span>'">
    </div>
    <a class="open-btn" href="https://mehdisoltani21-dot.github.io/People-Managment/panel/?t=apw-mk-p3w9x1">ورود به نرم‌افزار</a>
    <p class="hint">این صفحه مخصوص مسعود کاظمی است.<br>با اسکن بارکد یا زدن دکمه وارد می‌شوید.</p>
  </div>
</body>
</html>
