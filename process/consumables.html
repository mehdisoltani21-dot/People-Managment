<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script src="../gate.js?v=3"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملزومات مصرفی | APW</title>
</head>
<body style="margin:0;background:#0f0d0a;color:#f5a623;font-family:Vazirmatn,Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
<p id="b">بارگذاری ملزومات مصرفی...</p>
<script>
(async function(){
  try{
    var sources=[
      "./consumables-full.html?v=5",
      "https://cdn.jsdelivr.net/gh/mehdisoltani21-dot/People-Managment@5822c710b9/process/consumables.html",
      "https://raw.githubusercontent.com/mehdisoltani21-dot/People-Managment/5822c710b9/process/consumables.html"
    ];
    var html=null,err=null;
    for(var i=0;i<sources.length;i++){
      try{
        var r=await fetch(sources[i]);
        if(!r.ok) throw new Error("HTTP "+r.status);
        html=await r.text();
        if(html.indexOf("PLACEHOLDER")>=0||html.length<1000) throw new Error("bad");
        break;
      }catch(e){err=e}
    }
    if(!html) throw err||new Error("fail");
    // inject patch for glued/unglued on form
    if(html.indexOf("consumables-glue.js")<0){
      html=html.replace("</body>",'<script src="consumables-glue.js?v=5"><\/script></body>');
    }
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById("b").textContent="خطا: "+(e.message||e);
  }
})();
</script>
</body>
</html>
