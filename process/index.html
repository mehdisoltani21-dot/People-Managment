<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script src="../gate.js?v=5"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت وقایع فرآیندی | APW</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#0f0d0a;color:#f5f0e8;min-height:100vh;line-height:1.65}
.top{position:sticky;top:0;z-index:20;background:rgba(15,13,10,.95);border-bottom:1px solid #3d3428;padding:12px 16px}
.top-inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.nav-home{display:inline-flex;background:linear-gradient(135deg,#f5a623,#e8910f);color:#1a1208!important;font-weight:800;font-size:.85rem;padding:9px 14px;border-radius:11px;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.section{background:linear-gradient(145deg,#2a2318,#1a1610);border:1px solid #3d3428;border-radius:16px;padding:18px;margin-bottom:14px}
.section h2{color:#f5a623;font-size:1.1rem;margin-bottom:6px}
.desc{color:#a89a86;font-size:.88rem;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.75rem;color:#a89a86}.req{color:#f87171}
.fg input,.fg select,textarea{padding:10px 12px;border-radius:12px;border:1px solid #4a4030;background:#16120e;color:#f5f0e8;font-family:inherit;width:100%}
.ops-box{grid-column:1/-1;border:1px solid #3d3428;border-radius:14px;padding:12px;background:#14110c}
.ops-box h3{color:#f5c56a;font-size:.95rem;margin-bottom:10px}
.ops-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{border:none;border-radius:11px;padding:10px 16px;font-family:inherit;font-weight:800;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#f5a623,#e8910f);color:#1a1208}
.btn-secondary{background:#2a2418;border:1px solid #5a4030;color:#f5c56a}
.btn-danger{background:#3b1a1a;border:1px solid #7f1d1d;color:#fca5a5}
.btn-sm{padding:6px 10px;font-size:.8rem}
.msg{margin-top:10px;font-size:.88rem;min-height:1.2em;color:#f5c56a}
.view-back{background:linear-gradient(135deg,#f5a623,#e8910f);color:#1a1208;font-weight:800;border:none;border-radius:12px;padding:.5rem 1rem;cursor:pointer;margin-bottom:12px;font-family:inherit}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;margin:24px auto}
@media(max-width:560px){.home-grid{grid-template-columns:1fr}}
.home-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:140px;padding:20px;border-radius:18px;border:1px solid #3d3428;background:linear-gradient(145deg,#2a2318,#1a1610);cursor:pointer;color:inherit;text-decoration:none;font-family:inherit}
.home-card:hover{border-color:#f5a623}
.home-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;background:linear-gradient(135deg,#f5a623,#d97706);color:#1a1208}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:8px 6px;border-bottom:1px solid #2a2418;text-align:right}
th{color:#f5a623;background:#1a1610;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#2a2418;border:1px solid #5a4030;color:#f5c56a;font-size:.75rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#14110c;border:1px solid #3d3428;border-radius:12px;padding:12px;text-align:center}
.stat .l{font-size:.75rem;color:#a89a86}.stat .v{font-size:1.15rem;font-weight:800;color:#f5a623}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input,.tools select{padding:8px 10px;border-radius:10px;border:1px solid #4a4030;background:#16120e;color:#f5f0e8;font-family:inherit}
.table-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-bottom:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="top-inner">
    <div><strong>مدیریت وقایع فرآیندی</strong></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span id="user-label"></span>
      <a class="nav-home" href="../">صفحه اصلی</a>
      <button type="button" class="btn btn-secondary btn-sm" id="logout-btn">خروج</button>
    </div>
  </div></div>
  <div class="wrap">
    <section id="home-view">
      <div class="home-grid">
        <button type="button" class="home-card" id="go-form"><div class="home-icon">＋</div><strong>ثبت واقعه جدید</strong></button>
        <button type="button" class="home-card" id="go-list"><div class="home-icon">≡</div><strong>مشاهده وقایع</strong></button>
        <a class="home-card" href="./consumables.html"><div class="home-icon">Σ</div><strong>ملزومات مصرفی</strong></a>
      </div>
    </section>
    <section id="form-view" hidden>
      <button type="button" class="view-back" data-back>→ بازگشت</button>
      <div class="section">
        <h2 id="form-title">ثبت واقعه فرآیندی جدید</h2>
        <p class="desc">برای نوع تعمیرات به‌جای تعداد، توضیحات نشان داده می‌شود. زمان شروع و پایان اختیاری است.</p>
        <form id="ev-form" novalidate>
          <div class="form-grid">
            <div class="fg"><label>تاریخ <span class="req">*</span></label><input type="date" id="f-date" required></div>
            <div class="fg"><label>ایستگاه کاری <span class="req">*</span></label><select id="f-ws" required></select></div>
            <div class="fg"><label>نوع فرآیند <span class="req">*</span></label><select id="f-type" required></select></div>
            <div class="fg" id="wrap-qty"><label>تعداد</label><input type="number" id="f-qty" min="0" step="any" placeholder="مثلا 20"></div>
            <div class="fg" id="wrap-desc" hidden style="grid-column:1/-1"><label>توضیحات <span class="req">*</span></label><textarea id="f-desc" rows="3" placeholder="شرح تعمیرات"></textarea></div>
            <div class="fg"><label>زمان شروع</label><input type="time" id="f-start"></div>
            <div class="fg"><label>زمان پایان</label><input type="time" id="f-end"></div>
            <div class="fg"><label>تاریخ ثبت</label><input type="text" id="f-created" readonly></div>
            <div class="fg"><label>نفر ثبت‌کننده</label><input type="text" id="f-by" readonly></div>
            <div class="ops-box"><h3>اپراتورها</h3><div class="ops-grid">
              <div class="fg"><label>اپراتور 1 <span class="req">*</span></label><select id="f-op1" required></select></div>
              <div class="fg"><label>اپراتور 2</label><select id="f-op2"></select></div>
              <div class="fg"><label>اپراتور 3</label><select id="f-op3"></select></div>
              <div class="fg"><label>اپراتور 4</label><select id="f-op4"></select></div>
            </div></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="save-btn">ذخیره رکورد</button>
            <button type="button" class="btn btn-secondary" id="cancel-edit" hidden>لغو ویرایش</button>
          </div>
          <p class="msg" id="form-msg"></p>
        </form>
      </div>
    </section>
    <section id="list-view" hidden>
      <button type="button" class="view-back" data-back>→ بازگشت</button>
      <div class="section">
        <div class="table-head">
          <div><h2>جدول وقایع فرآیندی</h2></div>
          <div class="tools">
            <input type="search" id="q" placeholder="جستجو">
            <select id="filter-type"><option value="">همه انواع</option></select>
            <button type="button" class="btn btn-secondary btn-sm" id="export-btn">اکسل</button>
          </div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>تاریخ</th><th>ایستگاه</th><th>نوع</th><th>تعداد / توضیحات</th><th>شروع</th><th>پایان</th><th>اپ1</th><th>اپ2</th><th>اپ3</th><th>اپ4</th><th>ثبت</th><th>ثبت‌کننده</th><th id="th-acts">عملیات</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
      </div>
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://rtefjfvkjpatzitjjvwe.supabase.co";
const SUPABASE_KEY = "sb_publishable_RK_M3waIU7Z4jLYcs5LFqQ_7dSYHDFP";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = supabaseClient;
const TABLE = "process_events";
const PROCESS_TYPES = ["تعمیرات","برش کوشه بند","اینجه کاپاک","کالین کاپاک","آماده سازی کارتن","نظافت عمومی خط تولید","برش فویل کارتلا","برش پروفیل کارتلا","برش پنل کارتلا"];
const WORKSTATIONS = ["ورودی","روکش زیرین","سنباده پنل","روکش فوقانی","اوستا باشی پنل","اوستاباشی پروفیل","گزارشگیر","بسته بندی پنل","برش فویل","روکش پروفیل","سنباده پروفیل","فرزه","سلکو","پالت سازی"];
const PEOPLE = [
  {id:"7020",name:"Arash Baba"},{id:"7021",name:"Daryoush Kazemkhanloo"},{id:"7022",name:"Mehdi Afashar Vangini"},
  {id:"7023",name:"Hossein Amandiha"},{id:"7065",name:"Alireza Zolghadr"},{id:"7071",name:"Rahim Ghalandari"},
  {id:"7083",name:"Mohammad Khalkhali"},{id:"7085",name:"Hossein Taghiloo"},{id:"7088",name:"Mohsen Mirasheh"},
  {id:"7089",name:"Mohammad Qazvini"},{id:"7092",name:"Saeid Rezaei"},{id:"7111",name:"Mohammadreza Esmaili"},
  {id:"7118",name:"Alireza Soleymani"},{id:"7152",name:"Amin Rastegar"},{id:"7154",name:"Keykhosro Gurani"},
  {id:"7196",name:"Hossein Dehghan Nejad"},{id:"7197",name:"Esmaeil Alian"},{id:"7216",name:"Farzin Shali"},
  {id:"7240",name:"Dariush Hazrati"}
];
let profile = null, rows = [], editId = null;
const $ = function(id){ return document.getElementById(id); };
function esc(s){
  var d = document.createElement("div");
  d.textContent = (s == null ? "" : String(s));
  return d.innerHTML;
}
function todayIso(){
  var d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function faDate(s){
  if(!s) return "-";
  try { return new Date(s + "T12:00:00").toLocaleDateString("fa-IR"); } catch(e){ return s; }
}
function faDateTime(s){
  if(!s) return "-";
  try { return new Date(s).toLocaleString("fa-IR"); } catch(e){ return s; }
}
function isAdmin(){ return profile && String(profile.role).toLowerCase() === "admin"; }
function personName(id){
  var p = PEOPLE.find(function(x){ return x.id === id; });
  return p ? p.name : "";
}
function fill(sel, items, ph){
  if(!sel) return;
  sel.innerHTML = "";
  var o = document.createElement("option");
  o.value = ""; o.textContent = ph; sel.appendChild(o);
  items.forEach(function(v){
    var x = document.createElement("option");
    if(typeof v === "string"){ x.value = v; x.textContent = v; }
    else { x.value = v.id; x.textContent = v.name; }
    sel.appendChild(x);
  });
}
function isRepair(type){ return String(type || "").trim() === "تعمیرات"; }
function syncTypeFields(){
  var repair = isRepair($("f-type") && $("f-type").value);
  if($("wrap-qty")) $("wrap-qty").hidden = repair;
  if($("wrap-desc")) $("wrap-desc").hidden = !repair;
  if(repair){ if($("f-qty")) $("f-qty").value = ""; }
  else { if($("f-desc")) $("f-desc").value = ""; }
}
function show(view){
  if($("home-view")) $("home-view").hidden = (view !== "home");
  if($("form-view")) $("form-view").hidden = (view !== "form");
  if($("list-view")) $("list-view").hidden = (view !== "list");
}
function resetForm(){
  editId = null;
  $("form-title").textContent = "ثبت واقعه فرآیندی جدید";
  $("save-btn").textContent = "ذخیره رکورد";
  $("cancel-edit").hidden = true;
  $("f-date").value = todayIso();
  $("f-ws").value = "";
  $("f-type").value = "";
  $("f-qty").value = "";
  if($("f-desc")) $("f-desc").value = "";
  if($("f-start")) $("f-start").value = "";
  if($("f-end")) $("f-end").value = "";
  syncTypeFields();
  $("f-op1").value = ""; $("f-op2").value = ""; $("f-op3").value = ""; $("f-op4").value = "";
  $("f-created").value = faDateTime(new Date().toISOString());
  $("f-by").value = (profile && (profile.full_name || profile.name)) || "";
  $("form-msg").textContent = "";
}
async function loadRows(){
  var res = await supabaseClient.from(TABLE).select("*").order("event_date",{ascending:false}).order("created_at",{ascending:false}).limit(500);
  if(res.error){ rows = []; renderList(); alert("خطا: " + res.error.message); return; }
  rows = res.data || [];
  var ft = $("filter-type"); var cur = ft.value;
  ft.innerHTML = '<option value="">همه انواع</option>';
  PROCESS_TYPES.forEach(function(t){ var o = document.createElement("option"); o.value = t; o.textContent = t; ft.appendChild(o); });
  ft.value = cur;
  renderList();
}
function filtered(){
  var q = (($("q").value) || "").trim().toLowerCase();
  var t = $("filter-type").value;
  return rows.filter(function(r){
    if(t && r.process_type !== t) return false;
    if(!q) return true;
    return [r.workstation,r.process_type,r.description,r.operator1_name,r.operator2_name,r.operator3_name,r.operator4_name,r.created_by_name].some(function(v){
      return String(v == null ? "" : v).toLowerCase().indexOf(q) >= 0;
    });
  });
}
function renderList(){
  var list = filtered();
  var total = list.reduce(function(s,r){ return s + (Number(r.quantity) || 0); }, 0);
  var byType = {};
  list.forEach(function(r){ byType[r.process_type] = (byType[r.process_type] || 0) + 1; });
  var top = Object.keys(byType).map(function(k){ return [k, byType[k]]; }).sort(function(a,b){ return b[1]-a[1]; })[0];
  $("stats").innerHTML = '<div class="stat"><div class="l">رکورد</div><div class="v">'+list.length+'</div></div>'+
    '<div class="stat"><div class="l">جمع تعداد</div><div class="v">'+total.toLocaleString("fa-IR")+'</div></div>'+
    '<div class="stat"><div class="l">پرتکرار</div><div class="v" style="font-size:1rem">'+(top ? esc(top[0]) : "-")+'</div></div>';
  var tb = $("tbody"); tb.innerHTML = "";
  list.forEach(function(r,i){
    var qtyOrDesc = isRepair(r.process_type) ? (r.description || "-") : (r.quantity == null ? "-" : Number(r.quantity).toLocaleString("fa-IR"));
    var tr = document.createElement("tr");
    var acts = isAdmin()
      ? ('<td><div class="acts"><button type="button" class="btn btn-secondary btn-sm" data-edit="'+esc(r.id)+'">ویرایش</button> '+
         '<button type="button" class="btn btn-danger btn-sm" data-del="'+esc(r.id)+'">حذف</button></div></td>')
      : "";
    tr.innerHTML = "<td>"+(i+1)+"</td><td>"+faDate(r.event_date)+"</td><td>"+esc(r.workstation)+
      "</td><td><span class=\"tag\">"+esc(r.process_type)+"</span></td><td>"+esc(String(qtyOrDesc))+
      "</td><td>"+esc(r.start_time||"-")+"</td><td>"+esc(r.end_time||"-")+
      "</td><td>"+esc(r.operator1_name||"-")+"</td><td>"+esc(r.operator2_name||"-")+
      "</td><td>"+esc(r.operator3_name||"-")+"</td><td>"+esc(r.operator4_name||"-")+
      "</td><td>"+faDateTime(r.created_at)+"</td><td>"+esc(r.created_by_name||"-")+"</td>"+acts;
    tb.appendChild(tr);
  });
  if($("th-acts")) $("th-acts").style.display = isAdmin() ? "" : "none";
}
function bindUI(){
  $("go-form").onclick = function(){ resetForm(); show("form"); };
  $("go-list").onclick = async function(){ show("list"); await loadRows(); };
  document.querySelectorAll("[data-back]").forEach(function(b){ b.onclick = function(){ show("home"); }; });
  $("q").oninput = function(){ renderList(); };
  $("filter-type").onchange = function(){ renderList(); };
  $("f-type").onchange = syncTypeFields;
  $("cancel-edit").onclick = function(){ resetForm(); show("list"); };
  $("ev-form").onsubmit = async function(e){
    e.preventDefault();
    var msg = $("form-msg");
    var date = $("f-date").value, ws = $("f-ws").value, type = $("f-type").value, op1 = $("f-op1").value;
    if(!date || !ws || !type || !op1){ msg.textContent = "تاریخ، ایستگاه، نوع و اپراتور 1 الزامی است."; return; }
    var repair = isRepair(type);
    var qtyRaw = $("f-qty").value;
    var desc = (($("f-desc") && $("f-desc").value) || "").trim();
    if(repair && !desc){ msg.textContent = "برای تعمیرات، توضیحات را وارد کنید."; return; }
    var row = {
      event_date: date, workstation: ws, process_type: type,
      quantity: repair ? null : (qtyRaw === "" ? null : Number(qtyRaw)),
      description: repair ? desc : null,
      start_time: ($("f-start") && $("f-start").value) || null,
      end_time: ($("f-end") && $("f-end").value) || null,
      operator1_id: op1, operator1_name: personName(op1),
      operator2_id: $("f-op2").value || null, operator2_name: personName($("f-op2").value) || null,
      operator3_id: $("f-op3").value || null, operator3_name: personName($("f-op3").value) || null,
      operator4_id: $("f-op4").value || null, operator4_name: personName($("f-op4").value) || null,
      created_by: (profile && profile.id) || null,
      created_by_name: (profile && (profile.full_name || profile.name)) || null
    };
    msg.textContent = "در حال ذخیره...";
    var error;
    if(editId){
      var u = await supabaseClient.from(TABLE).update(row).eq("id", editId);
      error = u.error;
    } else {
      var ins = await supabaseClient.from(TABLE).insert(row);
      error = ins.error;
    }
    if(error){ msg.textContent = "خطا: " + error.message; return; }
    msg.textContent = "ذخیره شد.";
    resetForm(); show("list"); await loadRows();
  };
  $("tbody").onclick = async function(e){
    var ed = e.target.closest("[data-edit]");
    var del = e.target.closest("[data-del]");
    if(ed){
      var r = rows.find(function(x){ return x.id === ed.getAttribute("data-edit"); });
      if(!r) return;
      editId = r.id;
      $("form-title").textContent = "ویرایش واقعه";
      $("save-btn").textContent = "ذخیره تغییرات";
      $("cancel-edit").hidden = false;
      $("f-date").value = r.event_date || "";
      $("f-ws").value = r.workstation || "";
      $("f-type").value = r.process_type || "";
      $("f-qty").value = (r.quantity == null ? "" : r.quantity);
      if($("f-desc")) $("f-desc").value = r.description || "";
      if($("f-start")) $("f-start").value = r.start_time || "";
      if($("f-end")) $("f-end").value = r.end_time || "";
      syncTypeFields();
      $("f-op1").value = r.operator1_id || "";
      $("f-op2").value = r.operator2_id || "";
      $("f-op3").value = r.operator3_id || "";
      $("f-op4").value = r.operator4_id || "";
      $("f-created").value = faDateTime(r.created_at);
      $("f-by").value = r.created_by_name || "";
      show("form");
    }
    if(del){
      if(!confirm("حذف شود؟")) return;
      var dres = await supabaseClient.from(TABLE).delete().eq("id", del.getAttribute("data-del"));
      if(dres.error) alert(dres.error.message); else await loadRows();
    }
  };
  $("export-btn").onclick = function(){
    var list = filtered();
    if(!list.length){ alert("داده‌ای نیست"); return; }
    function cell(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
    var head = ["ردیف","تاریخ","ایستگاه","نوع","تعداد","توضیحات","شروع","پایان","اپ1","اپ2","اپ3","اپ4","ثبت","ثبت‌کننده"];
    var body = list.map(function(r,i){
      return [i+1,r.event_date,r.workstation,r.process_type,r.quantity==null?"":r.quantity,r.description||"",r.start_time||"",r.end_time||"",r.operator1_name||"",r.operator2_name||"",r.operator3_name||"",r.operator4_name||"",r.created_at,r.created_by_name||""];
    });
    var csv = [head].concat(body).map(function(r){ return r.map(cell).join(","); }).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\uFEFF", csv], {type:"text/csv;charset=utf-8;"}));
    a.download = "process_events.csv";
    a.click();
  };
}
bindUI();
$("logout-btn").onclick = async function(){ await supabaseClient.auth.signOut(); location.href = "../"; };
(async function(){
  var sessRes = await supabaseClient.auth.getSession();
  var sess = sessRes.data && sessRes.data.session;
  if(!sess){ location.href = "../"; return; }
  var uid = sess.user.id;
  var pr = await supabaseClient.from("user_profiles").select("*").eq("id", uid).maybeSingle();
  profile = pr.data || {id: uid, full_name: sess.user.email, role: "user"};
  $("user-label").textContent = profile.full_name || profile.name || "کاربر";
  fill($("f-ws"), WORKSTATIONS, "انتخاب ایستگاه");
  fill($("f-type"), PROCESS_TYPES, "انتخاب نوع");
  ["f-op1","f-op2","f-op3","f-op4"].forEach(function(id){ fill($(id), PEOPLE, "انتخاب نفر"); });
  show("home");
})();
</script>
</body>
</html>
